function initResizers(){
  const app = document.getElementById('app');
  const MIN_LEFT=200, MAX_LEFT=520, MIN_RIGHT=240, MAX_RIGHT=560;
  let saved = null;
  try{ saved = JSON.parse(localStorage.getItem(LAYOUT_KEY)||'null'); }catch(e){ saved = null; }
  if(saved && saved.left) app.style.setProperty('--w-left', clamp(saved.left, MIN_LEFT, MAX_LEFT)+'px');
  if(saved && saved.right) app.style.setProperty('--w-right', clamp(saved.right, MIN_RIGHT, MAX_RIGHT)+'px');
  // Persisted synchronously (not debounced) on pointerup — a drag only fires
  // this once per gesture, and the user may reload right after resizing.
  const persistLayout = ()=>{
    try{
      const cs = getComputedStyle(app);
      const left = parseInt(cs.getPropertyValue('--w-left'),10);
      const right = parseInt(cs.getPropertyValue('--w-right'),10);
      localStorage.setItem(LAYOUT_KEY, JSON.stringify({left, right}));
    }catch(e){}
  };
  const wire = (id, varName, min, max, fromRight, fallback)=>{
    const handle = document.getElementById(id);
    if(!handle) return;
    handle.addEventListener('pointerdown', (e)=>{
      e.preventDefault();
      const startX = e.clientX;
      const cs = getComputedStyle(app);
      const startW = parseInt(cs.getPropertyValue(varName),10) || fallback;
      handle.classList.add('dragging');
      try{ handle.setPointerCapture(e.pointerId); }catch(err){}
      const onMove = (ev)=>{
        const dx = ev.clientX - startX;
        const next = clamp(fromRight ? startW - dx : startW + dx, min, max);
        app.style.setProperty(varName, next+'px');
      };
      const onUp = ()=>{
        handle.classList.remove('dragging');
        try{ handle.releasePointerCapture(e.pointerId); }catch(err){}
        handle.removeEventListener('pointermove', onMove);
        handle.removeEventListener('pointerup', onUp);
        persistLayout();
      };
      handle.addEventListener('pointermove', onMove);
      handle.addEventListener('pointerup', onUp);
    });
  };
  wire('resizerLeft', '--w-left', MIN_LEFT, MAX_LEFT, false, 272);
  wire('resizerRight', '--w-right', MIN_RIGHT, MAX_RIGHT, true, 328);
}

/* ============================================================
   Canvas image export (PNG / JPEG / PDF) — snapshots only the
   diagram content (nodes + edges + labels), cropped to its own
   bounding box, regardless of current pan/zoom/viewport size.
   ============================================================ */
function canvasContentBBox(){
  if(!state.classes.length) return null;
  const pad = 48;
  let minX=Infinity,minY=Infinity,maxX=-Infinity,maxY=-Infinity;
  state.classes.forEach(c=>{
    const w = c.w||CARD_W, h = c.h||classHeight(c);
    minX=Math.min(minX,c.x); minY=Math.min(minY,c.y);
    maxX=Math.max(maxX,c.x+w); maxY=Math.max(maxY,c.y+h);
  });
  return {x:minX-pad, y:minY-pad, w:(maxX-minX)+pad*2, h:(maxY-minY)+pad*2};
}
function collectCssVarNames(cssText){
  const names = new Set();
  const re = /(--[a-zA-Z0-9-]+)\s*:/g;
  let m;
  while((m = re.exec(cssText))) names.add(m[1]);
  return Array.from(names);
}
function resolvedVarsCss(cssText){
  const names = collectCssVarNames(cssText);
  const cs = getComputedStyle(document.documentElement);
  let css = ':root{';
  names.forEach(n=>{ const v = cs.getPropertyValue(n); if(v && v.trim()) css += n+':'+v.trim()+';'; });
  css += '}';
  return css;
}
function fullStylesheetText(){
  let css = '';
  document.querySelectorAll('style').forEach(s=>{ css += s.textContent + '\n'; });
  return css;
}
/* Builds a standalone, self-styled copy of #canvasSvg cropped to the
   model's bounding box. The clone is a detached document once serialized
   (loaded through a Blob URL into an <img>), so it can't see the live
   page's CSS cascade or its currently-active theme — we compensate by
   copying the whole stylesheet in, then appending a final :root block with
   every custom property resolved to its *current* literal value; being
   last in source order, it wins over every themed/media-query variant the
   copied stylesheet also carries, so the export always matches what's on
   screen right now. */
function buildCanvasSvgString(){
  const bbox = canvasContentBBox();
  if(!bbox) return null;
  const src = document.getElementById('canvasSvg');
  const clone = src.cloneNode(true);
  clone.setAttribute('viewBox', bbox.x+' '+bbox.y+' '+bbox.w+' '+bbox.h);
  clone.setAttribute('width', Math.round(bbox.w));
  clone.setAttribute('height', Math.round(bbox.h));
  clone.removeAttribute('style');
  const cssText = fullStylesheetText();
  const styleTag = document.createElementNS(SVGNS,'style');
  styleTag.textContent = cssText + '\n' + resolvedVarsCss(cssText);
  const defs = clone.querySelector('#svgDefs') || clone.querySelector('defs');
  if(defs) defs.insertBefore(styleTag, defs.firstChild);
  else clone.insertBefore(styleTag, clone.firstChild);
  const bg = S('rect', {x:bbox.x, y:bbox.y, width:bbox.w, height:bbox.h, fill:'var(--canvas-bg)'});
  const gridLayerEl = clone.querySelector('#gridLayer');
  clone.insertBefore(bg, gridLayerEl || clone.firstChild);
  return new XMLSerializer().serializeToString(clone);
}
function pickRasterScale(bbox){
  const MAX_DIM = 4000;
  let scale = 2;
  if(bbox.w*scale > MAX_DIM || bbox.h*scale > MAX_DIM) scale = Math.max(1, Math.min(MAX_DIM/bbox.w, MAX_DIM/bbox.h));
  return scale;
}
function rasterizeCanvas(bbox){
  return new Promise((resolve, reject)=>{
    const svgStr = buildCanvasSvgString();
    if(!svgStr){ reject(new Error('sem conteúdo')); return; }
    const blob = new Blob([svgStr], {type:'image/svg+xml;charset=utf-8'});
    const url = URL.createObjectURL(blob);
    const img = new Image();
    img.onload = ()=>{
      try{
        const scale = pickRasterScale(bbox);
        const w = Math.max(1, Math.round(bbox.w*scale)), h = Math.max(1, Math.round(bbox.h*scale));
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas);
      }catch(err){ reject(err); }
      finally{ URL.revokeObjectURL(url); }
    };
    img.onerror = ()=>{ URL.revokeObjectURL(url); reject(new Error('falha ao rasterizar')); };
    img.src = url;
  });
}
let jsPdfLoad = null;
function ensureJsPdf(){
  if(window.jspdf && window.jspdf.jsPDF) return Promise.resolve();
  if(jsPdfLoad) return jsPdfLoad;
  jsPdfLoad = new Promise((resolve, reject)=>{
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js';
    s.onload = ()=>resolve();
    s.onerror = ()=>{ jsPdfLoad = null; reject(new Error('load-failed')); };
    document.head.appendChild(s);
  });
  return jsPdfLoad;
}
async function exportCanvasImage(kind){
  const bbox = canvasContentBBox();
  if(!bbox){ toast('Adicione ao menos uma classe ao modelo antes de exportar uma imagem.', true); return; }
  const base = safeDownloadName(sqlIdent(state.meta.name||'modelo')+'_diagrama', kind==='jpeg'?'jpg':kind);
  try{
    if(kind==='pdf'){
      try{ await ensureJsPdf(); }catch(e){ toast('Não foi possível carregar o gerador de PDF (verifique a conexão).', true); return; }
    }
    const canvas = await rasterizeCanvas(bbox);
    if(kind==='png'){
      canvas.toBlob(b=>{ if(b) saveBinaryFile(base, b); else toast('Não foi possível gerar a imagem.', true); }, 'image/png');
    } else if(kind==='jpeg'){
      canvas.toBlob(b=>{ if(b) saveBinaryFile(base, b); else toast('Não foi possível gerar a imagem.', true); }, 'image/jpeg', 0.94);
    } else {
      const imgData = canvas.toDataURL('image/jpeg', 0.95);
      const { jsPDF } = window.jspdf;
      const wPt = bbox.w*0.75, hPt = bbox.h*0.75; // 96dpi px -> 72dpi pt
      const doc = new jsPDF({ orientation: wPt>=hPt?'landscape':'portrait', unit:'pt', format:[wPt,hPt] });
      doc.addImage(imgData, 'JPEG', 0, 0, wPt, hPt);
      saveBinaryFile(base, doc.output('blob'));
    }
  }catch(err){
    toast('Não foi possível exportar a imagem: '+(err && err.message ? err.message : err), true);
  }
}
async function saveBinaryFile(filename, blob){
  let ns = null;
  try{ if(window.claude && window.claude.use) ns = await window.claude.use('downloads'); }catch(e){ ns = null; }
  if(ns){
    try{
      await ns.save({filename, data:blob});
      toast('Arquivo salvo: '+filename);
      return;
    }catch(err){
      const code = err && err.code;
      if(code==='declined') return;
      if(code==='rejected_extension' || code==='extension_not_enabled'){
        toast('Este formato não pode ser salvo diretamente aqui.', true);
        return;
      }
    }
  }
  try{
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 2000);
  }catch(e){
    toast('Não foi possível baixar o arquivo.', true);
  }
}
function initImageExportMenu(){
  const btn = document.getElementById('btnImage');
  const menu = document.getElementById('imageMenu');
  if(!btn || !menu) return;
  const close = ()=>{ menu.hidden = true; };
  btn.addEventListener('click', (e)=>{
    e.stopPropagation();
    menu.hidden = !menu.hidden;
  });
  menu.addEventListener('click', (e)=>{
    const b = e.target.closest('button[data-fmt]');
    if(!b) return;
    close();
    exportCanvasImage(b.dataset.fmt);
  });
  document.addEventListener('click', (e)=>{ if(!menu.hidden && !menu.contains(e.target) && e.target!==btn) close(); });
  document.addEventListener('keydown', (e)=>{ if(e.key==='Escape') close(); });
}

function initTopbar(){
  document.getElementById('modelName').addEventListener('input', (e)=>{ state.meta.name = e.target.value; scheduleAutosave(); });

  document.getElementById('btnSample').addEventListener('click', (e)=>{
    const run = ()=>loadModel(sampleModel());
    if(state.classes.length) confirmAction(e.currentTarget, run); else run();
  });
  document.getElementById('btnNew').addEventListener('click', (e)=>{
    const run = ()=>loadModel(emptyModel());
    if(state.classes.length) confirmAction(e.currentTarget, run); else run();
  });
  document.getElementById('btnSave').addEventListener('click', ()=>{
    saveFile(sqlIdent(state.meta.name||'modelo')+'.json', JSON.stringify(state, null, 2));
  });
  document.getElementById('btnOpen').addEventListener('click', ()=> document.getElementById('fileOpen').click());
  document.getElementById('fileOpen').addEventListener('change', (e)=>{
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = ()=>{
      try{
        const data = JSON.parse(reader.result);
        if(!data.classes || !data.relationships) throw new Error('formato inválido');
        loadModel(data);
        toast('Modelo carregado.');
      }catch(err){ toast('Não foi possível abrir o arquivo: '+err.message, true); }
    };
    reader.readAsText(file);
    e.target.value = '';
  });

  document.querySelectorAll('.tab').forEach(tab=>{
    tab.addEventListener('click', ()=> switchRightTab(tab.dataset.tab));
  });
}
/* Switches the right-rail tab, keeping the tab highlight and the visible
   panel in sync with activeRightTab — selecting a class or relationship on
   the canvas sets activeRightTab='prop' too (see selectClass/selectRel), and
   without this shared function that switch never reached the DOM: the
   Propriedades content updated invisibly behind whichever tab (Exportar,
   Ajuda) happened to still be showing, so editing looked like it did
   nothing. */
function switchRightTab(tabId){
  activeRightTab = tabId;
  document.querySelectorAll('.tab').forEach(t=> t.classList.toggle('active', t.dataset.tab===tabId));
  document.getElementById('panelProp').classList.toggle('active', tabId==='prop');
  document.getElementById('panelExport').classList.toggle('active', tabId==='export');
  document.getElementById('panelLegend').classList.toggle('active', tabId==='legend');
}

/* ============================================================
   Boot
   ============================================================ */
function boot(){
  initDefs();
  initAddControls();
  initTopbar();
  initResizers();
  initImageExportMenu();
  initStageEvents();
  const saved = loadAutosave();
  state = saved || emptyModel();
  if(!state.meta) state.meta = emptyModel().meta;
  document.getElementById('modelName').value = state.meta.name || '';
  renderRelControls();
  renderLegendOnce();
  touch();
  requestAnimationFrame(fitView);
}
boot();

</script>
