      fieldSelect('Card. destino', r.cardTarget, CARDINALITIES.map(x=>({id:x,label:x})), v=>{ r.cardTarget=v; touch(); })
    ]));
    scroll.appendChild(buildCardHint(a?a.name:'?', r.cardSource, b?b.name:'?', r.cardTarget));
  } else if(r.type==='generalization'){
    scroll.appendChild(fieldSeg('Cobertura', r.total?'total':'partial', [{id:'total',label:'Total'},{id:'partial',label:'Parcial'}], v=>{ r.total=(v==='total'); touch(); }));
    scroll.appendChild(fieldSeg('Sobreposição', r.disjoint?'disjoint':'overlap', [{id:'disjoint',label:'Disjunta'},{id:'overlap',label:'Sobreposta'}], v=>{ r.disjoint=(v==='disjoint'); touch(); }));
  } else if(r.type==='aggregation'){
    scroll.appendChild(E('div',{class:'field-row'},[
      fieldSelect('Card. todo', r.cardSource, CARDINALITIES.map(x=>({id:x,label:x})), v=>{ r.cardSource=v; touch(); }),
      fieldSelect('Card. parte', r.cardTarget, CARDINALITIES.map(x=>({id:x,label:x})), v=>{ r.cardTarget=v; touch(); })
    ]));
    scroll.appendChild(buildCardHint(a?a.name:'?', r.cardSource, b?b.name:'?', r.cardTarget));
    scroll.appendChild(fieldCheck('Agregação espacial (controle topológico)', r.spatialControl, v=>{ r.spatialControl=v; touch(); }));
  } else if(r.type==='network'){
    scroll.appendChild(fieldCheck('Direcionado', r.directed, v=>{ r.directed=v; touch(); }));
  } else if(r.type==='spatial'){
    scroll.appendChild(fieldSelect('Regra topológica', r.topoRule, TOPO_RULES, v=>{ r.topoRule=v; touch(); }));
    scroll.appendChild(fieldText('Rótulo (opcional)', r.name||'', v=>{ r.name=v; touch(true); }));
  }
  root.appendChild(scroll);
  root.appendChild(E('div',{class:'inspector-actions'},[
    E('button',{class:'btn danger ghost', onclick:()=>deleteRel(r.id)},['Excluir relacionamento'])
  ]));
  return root;
}

function renderInspector(){
  const panel = document.getElementById('panelProp');
  panel.innerHTML = '';
  if(selection.type==='class'){
    const c = state.classes.find(x=>x.id===selection.id);
    if(!c){ selection={type:null,id:null}; renderInspector(); return; }
    panel.appendChild(buildClassInspector(c));
  } else if(selection.type==='rel'){
    const r = state.relationships.find(x=>x.id===selection.id);
    if(!r){ selection={type:null,id:null}; renderInspector(); return; }
    panel.appendChild(buildRelInspector(r));
  } else {
    panel.appendChild(E('div',{class:'inspector-empty'},[
      E('div',{class:'ic', html:ICONS.empty}),
      E('div',{},['Selecione uma classe ou relacionamento no diagrama, ou crie um novo pela barra à esquerda.'])
    ]));
  }
}

/* ============================================================
   EXPORT — shared helpers
   ============================================================ */
function geomKind(c){
  if(c.kind!=='geo' || !c.primitive) return null;
  const map = {
    point:    {esri:'esriGeometryPoint',    ogc:'POINT',           approx:false},
    node:     {esri:'esriGeometryPoint',    ogc:'POINT',           approx:false},
    line:     {esri:'esriGeometryPolyline', ogc:'LINESTRING',      approx:false},
    arc:      {esri:'esriGeometryPolyline', ogc:'LINESTRING',      approx:false},
    polygon:  {esri:'esriGeometryPolygon',  ogc:'POLYGON',         approx:false},
    isoline:      {esri:'esriGeometryPolyline', ogc:'MULTILINESTRING', approx:true},
    tin:          {esri:'esriGeometryPolygon',  ogc:'MULTIPOLYGON',    approx:true},
    tessellation: {esri:'esriGeometryPolygon',  ogc:'MULTIPOLYGON',    approx:true},
    sample:       {esri:'esriGeometryPoint',    ogc:'MULTIPOINT',      approx:true},
    partition:    {esri:'esriGeometryPolygon',  ogc:'MULTIPOLYGON',    approx:true}
  };
  if(c.primitive==='complex'){
    const ck = c.complexKind||'multipolygon';
    const cm = {multipoint:{esri:'esriGeometryMultipoint',ogc:'MULTIPOINT'}, multiline:{esri:'esriGeometryPolyline',ogc:'MULTILINESTRING'}, multipolygon:{esri:'esriGeometryPolygon',ogc:'MULTIPOLYGON'}, collection:{esri:'esriGeometryBag',ogc:'GEOMETRYCOLLECTION'}};
    return Object.assign({approx:false}, cm[ck]);
  }
  return map[c.primitive] || null;
}
function esriFieldType(t){ return {text:'esriFieldTypeString', integer:'esriFieldTypeInteger', double:'esriFieldTypeDouble', date:'esriFieldTypeDate', datetime:'esriFieldTypeDate', boolean:'esriFieldTypeSmallInteger', blob:'esriFieldTypeBlob'}[t] || 'esriFieldTypeString'; }
function esriFieldLen(t){ return {text:255, integer:4, double:8, date:8, datetime:8, boolean:2, blob:0}[t] ?? 255; }
function arcpyFieldType(t){ return {text:'TEXT', integer:'LONG', double:'DOUBLE', date:'DATE', datetime:'DATE', boolean:'SHORT', blob:'BLOB'}[t] || 'TEXT'; }
function arcpyGeomType(gk){ return gk ? ({esriGeometryPoint:'POINT', esriGeometryMultipoint:'MULTIPOINT', esriGeometryPolyline:'POLYLINE', esriGeometryPolygon:'POLYGON'}[gk.esri] || null) : null; }
function ogrFieldType(t){ return {text:'ogr.OFTString', integer:'ogr.OFTInteger', double:'ogr.OFTReal', date:'ogr.OFTDate', datetime:'ogr.OFTDateTime', boolean:'ogr.OFTInteger', blob:'ogr.OFTBinary'}[t] || 'ogr.OFTString'; }
function ogrGeomType(gk){ return gk ? ({esriGeometryPoint:'ogr.wkbPoint', esriGeometryMultipoint:'ogr.wkbMultiPoint', esriGeometryPolyline:'ogr.wkbMultiLineString', esriGeometryPolygon:'ogr.wkbMultiPolygon'}[gk.esri] || null) : null; }
/* area/line/point bucket used to pick an ArcGIS topology rule — collapses
   esriGeometryMultipoint into 'point' and drops esriGeometryBag (a
   heterogeneous "collection" primitive) to null, since no topology rule
   in ArcGIS's list applies to a mixed-geometry class. */
function geomCategory(c){
  const gk = geomKind(c);
  if(!gk) return null;
  if(gk.esri==='esriGeometryPolygon') return 'area';
  if(gk.esri==='esriGeometryPolyline') return 'line';
  if(gk.esri==='esriGeometryPoint' || gk.esri==='esriGeometryMultipoint') return 'point';
  return null;
}
/* Maps an OMT-G topological predicate + the (origin, dest) geometry
   categories to a real, documented ArcGIS "Add Rule To Topology" rule
   string — verified against ArcGIS Pro's own tool reference (Add Rule To
   Topology) rather than guessed. Only 'dentro' and 'disjunto' get an
   entry: ArcGIS's topology rule vocabulary is built almost entirely around
   FORBIDDING bad configurations ("must not overlap", "must not intersect")
   or asserting COVERAGE ("must be covered by/inside"), not around asserting
   that two classes touch, cross, or overlap — so 'toca', 'sobrepoe',
   'cruza', 'em_frente' and 'proximo' have no equivalent rule to call in any
   geometry combination, and correctly return null here rather than a
   fabricated one. Even the two that DO map are approximations of the OMT-G
   predicate, not exact equivalents — see each entry's `caveat`. */
function topologyRuleFor(predicate, catA, catB){
  if(predicate==='dentro'){
    if(catA==='area'&&catB==='area') return {rule:'Must Be Covered By Feature Class Of (Area-Area)'};
    if(catA==='line'&&catB==='area') return {rule:'Must Be Inside (Line-Area)'};
    if(catA==='point'&&catB==='area') return {rule:'Must Be Properly Inside (Point-Area)'};
    return null;
  }
  if(predicate==='disjunto'){
    if(catA==='area'&&catB==='area') return {rule:'Must Not Overlap With (Area-Area)', caveat:'permite fronteiras se tocando — não é disjunção estrita'};
    // A real two-class "line must not cross line" rule DOES exist in ArcGIS
    // (confirmed below, in topologyRuleXmlEnumFor, against a real exported
    // topology) — but only its raw esriTRTLineNoIntersectLine enum name is
    // confirmed, not the exact wording of the documented arcpy string
    // parameter, so it stays unmapped here rather than risking an
    // AddRuleToTopology call with an invalid rule_type string.
    return null;
  }
  return null;
}
/* Real esriTRT* topology-rule-type enum NAMES (not numbers) for a raw XML
   Workspace Document's <TopologyRuleType> element — confirmed by reading a
   real topology the user exported from their own ArcGIS Pro as an XML
   Workspace Document (2026-09), which showed this element holds the enum's
   symbolic name as text (e.g. "esriTRTAreaCoveredByAreaClass"), not the
   numeric code a different (ArcObjects/community-thread) representation had
   suggested earlier — that numeric table turned out not to apply to this
   file format. Origin/destination order below matches the real file's rules
   exactly (e.g. rule 24: OriginClassID=area-being-covered,
   DestinationClassID=covering area — same origin=part/dest=whole convention
   already used by topologyRuleFor's coverageCandidates). Only entries
   directly observed in that real export are included. */
function topologyRuleXmlEnumFor(predicate, catA, catB){
  if(predicate==='dentro'){
    if(catA==='area'&&catB==='area') return 'esriTRTAreaCoveredByAreaClass';
    if(catA==='line'&&catB==='area') return 'esriTRTLineInsideArea';
    if(catA==='point'&&catB==='area') return 'esriTRTPointProperlyInsideArea';
    return null;
  }
  if(predicate==='disjunto'){
    if(catA==='area'&&catB==='area') return 'esriTRTAreaNoOverlapArea';
    if(catA==='line'&&catB==='line') return 'esriTRTLineNoIntersectLine';
    return null;
  }
  return null;
}
/* Single-class geometric-integrity rules — the ones that don't come from any
   drawn relationship at all, just from a class having area or line geometry.
   Only "must not overlap (with itself)" is applied to every area class here;
   "must not have gaps" is deliberately NOT auto-applied even though it's a
   real, verified rule, because whether a layer is supposed to fully
   partition its extent is a modeling judgment the conceptual model doesn't
   encode (a municipality's neighborhoods should fully tile it; its
   registered lots should not — vacant, unregistered land is normal) — so
   it's left as guidance in a comment instead of guessed automatically. */
function generalTopologyRules(cat){
  if(cat==='area') return [{rule:'Must Not Overlap (Area)'}];
  if(cat==='line') return [{rule:'Must Not Self-Intersect (Line)'}, {rule:'Must Not Self-Overlap (Line)'}];
  return [];
}
function pyStr(s){ return String(s==null?'':s).replace(/\\/g,'\\\\').replace(/"/g,'\\"'); }
function gpkgType(t){ return {text:'TEXT', integer:'INTEGER', double:'REAL', date:'DATE', datetime:'DATETIME', boolean:'BOOLEAN', blob:'BLOB'}[t] || 'TEXT'; }
function pgType(t){ return {text:'text', integer:'integer', double:'double precision', date:'date', datetime:'timestamp', boolean:'boolean', blob:'bytea'}[t] || 'text'; }

/* synthetic FK fields derived from generalization / aggregation / network relationships */
function computeExportFields(c){
  const fields = c.attributes.map(a=>({name:sqlIdent(a.name), type:a.type, pk:a.pk, nullable:a.nullable, fkTable:null}));
  state.relationships.forEach(r=>{
    if(r.type==='generalization' && r.sourceId===c.id){
      const sup = state.classes.find(x=>x.id===r.targetId);
      if(sup) fields.push({name: sqlIdent(sup.name)+'_id', type:'integer', pk:false, nullable:false, fkTable: sqlIdent(sup.name), fkClassId: sup.id, fkNote:'generalização (' + (r.total?'total':'parcial') + ', ' + (r.disjoint?'disjunta':'sobreposta') + ')'});
    }
    if(r.type==='aggregation' && r.targetId===c.id){
      const whole = state.classes.find(x=>x.id===r.sourceId);
      if(whole) fields.push({name: sqlIdent(whole.name)+'_id', type:'integer', pk:false, nullable:(r.cardTarget==='0..*'||r.cardTarget==='0..1'), fkTable: sqlIdent(whole.name), fkClassId: whole.id, fkNote:'agregação todo-parte'+(r.spatialControl?' (com controle topológico espacial)':'')});
    }
    if(r.type==='network' && r.targetId===c.id){
      const node = state.classes.find(x=>x.id===r.sourceId);
      if(node){
        fields.push({name: sqlIdent(node.name)+'_no_origem_id', type:'integer', pk:false, nullable:true, fkTable: sqlIdent(node.name), fkClassId: node.id, fkNote:'rede: nó de origem do arco'});
        fields.push({name: sqlIdent(node.name)+'_no_destino_id', type:'integer', pk:false, nullable:true, fkTable: sqlIdent(node.name), fkClassId: node.id, fkNote:'rede: nó de destino do arco'});
      }
    }
    if(r.type==='association'){
      const plan = associationPlan(r);
      if(plan.mode==='fk' && plan.fkOn===c.id){
        const refClass = state.classes.find(x=>x.id===plan.refTo);
        if(refClass){
          const ownCard = (plan.fkOn===r.sourceId) ? r.cardSource : r.cardTarget;
          fields.push({name: sqlIdent(refClass.name)+'_id', type:'integer', pk:false, nullable:(ownCard==='0..*'||ownCard==='0..1'), fkTable: sqlIdent(refClass.name), fkClassId: refClass.id, fkNote:'associação'+(r.name?' ('+r.name+')':'')});
        }
      }
    }
  });
  return fields;
}
/* how to realize a simple association relationally */
function associationPlan(r){
  const many = (v)=> v==='0..*' || v==='1..*';
  const one = (v)=> v==='1' || v==='0..1';
  if(many(r.cardSource) && one(r.cardTarget)) return {mode:'fk', fkOn:r.sourceId, refTo:r.targetId};
  if(one(r.cardSource) && many(r.cardTarget)) return {mode:'fk', fkOn:r.targetId, refTo:r.sourceId};
  if(one(r.cardSource) && one(r.cardTarget)) return {mode:'fk', fkOn:r.sourceId, refTo:r.targetId};
  return {mode:'junction'};
}

/* ============================================================
   EXPORT #1 — Esri Geodatabase XML Workspace Document
   ============================================================ */
function buildEsriXML(){
  const srid = state.meta.srid || 4326;
  const wsName = pascalIdent(state.meta.workspaceName || state.meta.name || 'ModeloOMTG');
  const geoClasses = state.classes.filter(c=>c.kind==='geo');
  const flatClasses = state.classes.filter(c=>c.kind!=='geo');
  const fdsName = wsName + '_FD';
  // ArcGIS Pro's own default name for a topology created inside a dataset is
  // "<dataset>_Topology" (confirmed by a real export, see below) — matched
  // here and in buildArcpyScript for consistency with what ArcGIS Pro itself
  // would suggest.
  const topoName = fdsName + '_Topology';

  // Local surrogate dataset IDs. A real ArcGIS-exported XML Workspace
  // Document resolves a Topology rule's Origin/DestinationClassID against
  // each feature class's own <DSID> (confirmed 2026-09 by reading a real
  // topology the user exported from their own ArcGIS Pro) rather than by
  // name or array position. A document authored for IMPORT — not exported
  // from an existing database — has no real DSIDs yet, so every class here
  // gets a small, internally-consistent placeholder number instead of the
  // usual "-1" (fine for a class with no cross-references, but it would
  // make every class indistinguishable to a topology rule). This is a
  // standard local-surrogate-key technique for a hand-authored version of an
  // export format; unlike the rest of this function's structure, this
  // specific choice for a from-scratch document was not itself directly
  // confirmed against a real ArcGIS Pro import — worth checking after import.
  let nextDsid = 1;
  const dsidOf = new Map();
  [...geoClasses, ...flatClasses].forEach(c=>{ dsidOf.set(c.id, nextDsid++); });

  function sref(){
    return "<SpatialReference xsi:type='esri:GeographicCoordinateSystem'><WKID>"+srid+"</WKID><LatestWKID>"+srid+"</LatestWKID></SpatialReference>";
  }
  function xmlGuid(){
    const h = ()=>Math.floor(Math.random()*0x10000).toString(16).toUpperCase().padStart(4,'0');
    return h()+h()+'-'+h()+'-'+h()+'-'+h()+'-'+h()+h()+h();
  }
  function fieldXml(f, isOid){
    if(isOid){
      return "<Field xsi:type='esri:Field'><Name>OBJECTID</Name><Type>esriFieldTypeOID</Type><IsNullable>false</IsNullable><Length>4</Length><Precision>0</Precision><Scale>0</Scale><Required>true</Required><Editable>false</Editable><ModelName>OBJECTID</ModelName></Field>";
    }
    const t = esriFieldType(f.type);
    const len = f.type==='text' ? 255 : esriFieldLen(f.type);
    return "<Field xsi:type='esri:Field'><Name>"+escapeXml(f.name)+"</Name><Type>"+t+"</Type><IsNullable>"+(f.nullable!==false)+"</IsNullable><Length>"+len+"</Length><Precision>0</Precision><Scale>0</Scale><Required>"+(f.nullable===false)+"</Required><Editable>true</Editable><ModelName>"+escapeXml(f.name)+"</ModelName></Field>"
      + (f.fkTable ? "<!-- FK -> "+f.fkTable+" ("+(f.fkNote||'')+") -->" : "");
  }
  function shapeFieldXml(gk){
    return "<Field xsi:type='esri:Field'><Name>Shape</Name><Type>esriFieldTypeGeometry</Type><IsNullable>true</IsNullable><Length>0</Length><Precision>0</Precision><Scale>0</Scale><Required>false</Required><Editable>true</Editable><ModelName>Shape</ModelName>"
      + "<GeometryDef xsi:type='esri:GeometryDef'><AvgNumPoints>0</AvgNumPoints><GeometryType>"+gk.esri+"</GeometryType><HasM>false</HasM><HasZ>false</HasZ>"+sref()+"</GeometryDef></Field>";
  }

  // ---- Spatial relationships & spatial aggregations -> topology coverage
  // candidates. Mirrors buildArcpyScript's own pass exactly, so the XML and
  // the arcpy script agree on which relations become real topology rules. ----
  const coverageCandidates = [];
  state.relationships.forEach(r=>{
    const a = state.classes.find(x=>x.id===r.sourceId), b = state.classes.find(x=>x.id===r.targetId);
    if(!a || !b) return;
    if(r.type==='aggregation'){
      if(geomKind(a) && geomKind(b)) coverageCandidates.push({origin:b, dest:a, predicate:'dentro', label:b.name+' contido em '+a.name+' (agregação espacial)'});
    } else if(r.type==='spatial'){
      if(geomKind(a) && geomKind(b)) coverageCandidates.push({origin:a, dest:b, predicate:r.topoRule, label:a.name+' '+TOPO_RULE_LABEL[r.topoRule]+' '+b.name});
      else coverageCandidates.push({origin:a, dest:b, predicate:r.topoRule, label:a.name+' '+TOPO_RULE_LABEL[r.topoRule]+' '+b.name, noGeom:true});
    }
  });
  const unmappedSpatialNotes = [];
  const topoRuleEntries = [];
  const topoParticipants = new Set();
  coverageCandidates.forEach(({origin,dest,predicate,label,noGeom})=>{
    if(noGeom){ unmappedSpatialNotes.push(label+' — uma das classes não tem geometria; sem regra de topologia.'); return; }
    const catA = geomCategory(origin), catB = geomCategory(dest);
    const enumType = topologyRuleXmlEnumFor(predicate, catA, catB);
    if(!enumType){ unmappedSpatialNotes.push(label+' — sem regra de topologia equivalente no ArcGIS.'); return; }
    topoParticipants.add(origin.id); topoParticipants.add(dest.id);
    topoRuleEntries.push({enumType, originId: dsidOf.get(origin.id), destId: dsidOf.get(dest.id)});
  });

  function topologyRuleXml(entry, ruleId){
    return "<TopologyRule xsi:type='esri:TopologyRule'><HelpString></HelpString><RuleID>"+ruleId+"</RuleID><Name></Name>"
      + "<GUID>"+xmlGuid()+"</GUID>"
      + "<TopologyRuleType>"+entry.enumType+"</TopologyRuleType>"
      + "<OriginClassID>"+entry.originId+"</OriginClassID><OriginSubtype>0</OriginSubtype>"
      + "<DestinationClassID>"+entry.destId+"</DestinationClassID><DestinationSubtype>0</DestinationSubtype>"
      + "<TriggerErrorEvents>false</TriggerErrorEvents><AllOriginSubtypes>true</AllOriginSubtypes><AllDestinationSubtypes>true</AllDestinationSubtypes></TopologyRule>";
  }

  const topologyElement = topoRuleEntries.length ? (
    "<DataElement xsi:type='esri:DETopology'><CatalogPath>/FD="+fdsName+"/TOPO="+topoName+"</CatalogPath><Name>"+topoName+"</Name>"
    + "<DatasetType>esriDTTopology</DatasetType><DSID>-1</DSID><Versioned>false</Versioned><CanVersion>true</CanVersion>"
    + "<ConfigurationKeyword></ConfigurationKeyword>"
    + "<Extent xsi:type='esri:EnvelopeN'><XMin>NaN</XMin><YMin>NaN</YMin><XMax>NaN</XMax><YMax>NaN</YMax>"+sref()+"</Extent>"
    + sref()
    + "<ClusterTolerance>0.001</ClusterTolerance><ZClusterTolerance>0.001</ZClusterTolerance>"
    + "<MaxGeneratedErrorCount>-1</MaxGeneratedErrorCount>"
    + "<FeatureClassNames xsi:type='esri:Names'>"+[...topoParticipants].map(id=>state.classes.find(c=>c.id===id)).filter(Boolean).map(c=>"<Name>"+escapeXml(pascalIdent(c.name))+"</Name>").join('')+"</FeatureClassNames>"
    + "<TopologyRules xsi:type='esri:ArrayOfTopologyRule'>"+topoRuleEntries.map((e,i)=>topologyRuleXml(e,i+1)).join('')+"</TopologyRules>"
    + "<TopologyID>-1</TopologyID><EditorTrackingEnabled>false</EditorTrackingEnabled>"
    + "<CreatorFieldName></CreatorFieldName><CreatedAtFieldName></CreatedAtFieldName><EditorFieldName></EditorFieldName><EditedAtFieldName></EditedAtFieldName>"
    + "<IsTimeInUTC>true</IsTimeInUTC><Properties xsi:nil='true' /></DataElement>"
  ) : '';

  function controllerMembershipsXml(c){
    if(!topoParticipants.has(c.id)) return "<ControllerMemberships xsi:type='esri:ArrayOfControllerMembership' />";
    return "<ControllerMemberships xsi:type='esri:ArrayOfControllerMembership'><ControllerMembership xsi:type='esri:TopologyMembership'><TopologyName>"+topoName+"</TopologyName><Weight>5</Weight><XYRank>1</XYRank><ZRank>1</ZRank><EventNotificationOnValidate>false</EventNotificationOnValidate></ControllerMembership></ControllerMemberships>";
  }

  // CatalogPath uses the root-relative "/FD=.../FC=..." scheme a real
  // ArcGIS Pro export actually uses (confirmed 2026-09), not the
  // "\\workspace\\dataset\\class" scheme assumed before that evidence
  // existed. A standalone table's exact convention wasn't itself present in
  // that real export (it had no tables) — "/Name" here is the same
  // root-relative pattern extended by analogy, not independently confirmed.
  function dataElement(c){
    const fields = computeExportFields(c);
    const gk = geomKind(c);
    const isFC = !!gk;
    const catalogPath = isFC ? ("/FD="+fdsName+"/FC="+pascalIdent(c.name)) : ("/"+pascalIdent(c.name));
    let fieldsXml = fieldXml(null,true) + fields.map(f=>fieldXml(f,false)).join('');
    if(isFC) fieldsXml += shapeFieldXml(gk);
    const note = gk && gk.approx ? "<!-- Observação: primitiva conceitual '"+c.primitive+"' não tem equivalente vetorial direto no geodatabase; exportada como "+gk.esri+" (revisar armazenamento em ArcGIS Pro). -->" : "";
    const dsid = dsidOf.get(c.id);
    if(isFC){
      return note + "<DataElement xsi:type='esri:DEFeatureClass'><CatalogPath>"+catalogPath+"</CatalogPath><Name>"+escapeXml(pascalIdent(c.name))+"</Name>"
        + "<DatasetType>esriDTFeatureClass</DatasetType><DSID>"+dsid+"</DSID><Versioned>false</Versioned><CanVersion>false</CanVersion>"
        + "<HasOID>true</HasOID><OIDFieldName>OBJECTID</OIDFieldName>"
        + "<Fields xsi:type='esri:Fields'><FieldArray xsi:type='esri:ArrayOfField'>"+fieldsXml+"</FieldArray></Fields>"
        + "<Indexes xsi:type='esri:Indexes'><IndexArray xsi:type='esri:ArrayOfIndex' /></Indexes>"
        + "<CLSID>{52353152-891A-11D0-BEC6-00805F7C4268}</CLSID><EXTCLSID></EXTCLSID>"
        + "<RelationshipClassNames xsi:type='esri:Names' />"
        + "<AliasName>"+escapeXml(c.name)+"</AliasName><ModelName></ModelName><HasGlobalID>false</HasGlobalID><GlobalIDFieldName></GlobalIDFieldName><RasterFieldName></RasterFieldName>"
        + "<ExtensionProperties xsi:type='esri:PropertySet'><PropertyArray xsi:type='esri:ArrayOfPropertySetProperty' /></ExtensionProperties>"
        + controllerMembershipsXml(c)
        + "<FeatureType>esriFTSimple</FeatureType><ShapeType>"+gk.esri+"</ShapeType><ShapeFieldName>Shape</ShapeFieldName><HasM>false</HasM><HasZ>false</HasZ><HasSpatialIndex>true</HasSpatialIndex>"
        + "<AreaFieldName></AreaFieldName><LengthFieldName></LengthFieldName><Extent xsi:nil='true' />"+sref()+"</DataElement>";
    }
    return "<DataElement xsi:type='esri:DETable'><CatalogPath>"+catalogPath+"</CatalogPath><Name>"+escapeXml(pascalIdent(c.name))+"</Name>"
      + "<DatasetType>esriDTTable</DatasetType><DSID>"+dsid+"</DSID><Versioned>false</Versioned><CanVersion>false</CanVersion>"
      + "<HasOID>true</HasOID><OIDFieldName>OBJECTID</OIDFieldName>"
      + "<Fields xsi:type='esri:Fields'><FieldArray xsi:type='esri:ArrayOfField'>"+fieldsXml+"</FieldArray></Fields>"
      + "<Indexes xsi:type='esri:Indexes'><IndexArray xsi:type='esri:ArrayOfIndex' /></Indexes>"
      + "<CLSID>{7A566981-C114-11D2-8A28-006097AFF44E}</CLSID><EXTCLSID></EXTCLSID>"
      + "<RelationshipClassNames xsi:type='esri:Names' />"
      + "<AliasName>"+escapeXml(c.name)+"</AliasName><ModelName></ModelName><HasGlobalID>false</HasGlobalID><GlobalIDFieldName></GlobalIDFieldName>"
      + "<ExtensionProperties xsi:type='esri:PropertySet'><PropertyArray xsi:type='esri:ArrayOfPropertySetProperty' /></ExtensionProperties>"
      + "<ControllerMemberships xsi:type='esri:ArrayOfControllerMembership' /></DataElement>";
  }
  function relKey(role, keyName, keyRole){
    return "<RelationshipClassKey xsi:type='esri:RelationshipClassKey'><ObjectKeyName>"+keyName+"</ObjectKeyName><ClassKeyName>"+keyName+"</ClassKeyName><KeyRole>"+keyRole+"</KeyRole></RelationshipClassKey>";
  }
  // Relationship classes keep their previous (whitepaper-derived, not
  // independently re-confirmed) internal structure — the user's real export
  // had no relationship class to check it against — except for the
  // CatalogPath prefix, updated to the same root-relative scheme confirmed
  // for everything else in this document, so the whole file is at least
  // internally consistent about that one convention.
  function relationshipXml(name, originName, destName, cardinality, isComposite, origPk, destFk, fwdLabel, bwdLabel){
    return "<DataElement xsi:type='esri:DERelationshipClass'><CatalogPath>/"+name+"</CatalogPath><Name>"+escapeXml(name)+"</Name>"
      + "<DatasetType>esriDTRelationshipClass</DatasetType><DSID>-1</DSID><Versioned>false</Versioned><CanVersion>false</CanVersion>"
      + "<Fields xsi:type='esri:Fields'><FieldArray xsi:type='esri:ArrayOfField'>"+fieldXml(null,true)+"</FieldArray></Fields>"
      + "<AliasName>"+escapeXml(name)+"</AliasName><ModelName></ModelName>"
      + "<CardinalityString>"+cardinality+"</CardinalityString><Cardinality>"+cardinality+"</Cardinality>"
      + "<Notification>esriRelNotificationNone</Notification><IsAttachmentRelationship>false</IsAttachmentRelationship><IsAttributed>false</IsAttributed>"
      + "<IsComposite>"+isComposite+"</IsComposite><KeyType>esriRelKeyTypeSingle</KeyType>"
      + "<ClassKey>"+destFk+"</ClassKey><ForwardPathLabel>"+escapeXml(fwdLabel)+"</ForwardPathLabel><BackwardPathLabel>"+escapeXml(bwdLabel)+"</BackwardPathLabel>"
      + "<OriginClassNames xsi:type='esri:Names'><Name>"+escapeXml(originName)+"</Name></OriginClassNames>"
      + "<DestinationClassNames xsi:type='esri:Names'><Name>"+escapeXml(destName)+"</Name></DestinationClassNames>"
      + "<OriginClassKeys xsi:type='esri:ArrayOfRelationshipClassKey'>"+relKey('origin', origPk, 'esriRelKeyTypeOriginPrimary')+"</OriginClassKeys>"
      + "<DestinationClassKeys xsi:type='esri:ArrayOfRelationshipClassKey'>"+relKey('dest', destFk, 'esriRelKeyTypeOriginForeign')+"</DestinationClassKeys>"
      + "</DataElement>";
  }

  const geoElements = geoClasses.map(dataElement).join('\n          ');
  const flatElements = flatClasses.map(dataElement).join('\n      ');

  const relElements = [];
  state.relationships.forEach(r=>{
    const a = state.classes.find(x=>x.id===r.sourceId), b = state.classes.find(x=>x.id===r.targetId);
    if(!a || !b) return;
    if(r.type==='generalization'){
      relElements.push(relationshipXml(pascalIdent(a.name)+'Generaliza'+pascalIdent(b.name), pascalIdent(b.name), pascalIdent(a.name), 'esriRelCardinalityOneToOne', true, 'OBJECTID', sqlIdent(b.name)+'_id', 'é especializada por', 'especializa'));
    } else if(r.type==='aggregation'){
      relElements.push(relationshipXml(pascalIdent(a.name)+'Agrega'+pascalIdent(b.name), pascalIdent(a.name), pascalIdent(b.name), 'esriRelCardinalityOneToMany', true, 'OBJECTID', sqlIdent(a.name)+'_id', 'agrega', 'é parte de'));
    } else if(r.type==='network'){
      relElements.push(relationshipXml(pascalIdent(a.name)+'ConectaOrigem'+pascalIdent(b.name), pascalIdent(a.name), pascalIdent(b.name), 'esriRelCardinalityOneToMany', false, 'OBJECTID', sqlIdent(a.name)+'_no_origem_id', 'é origem de', 'parte de (nó origem)'));
      relElements.push(relationshipXml(pascalIdent(a.name)+'ConectaDestino'+pascalIdent(b.name), pascalIdent(a.name), pascalIdent(b.name), 'esriRelCardinalityOneToMany', false, 'OBJECTID', sqlIdent(a.name)+'_no_destino_id', 'é destino de', 'parte de (nó destino)'));
    } else if(r.type==='association'){
      const plan = associationPlan(r);
      const card = plan.mode==='junction' ? 'esriRelCardinalityManyToMany' : 'esriRelCardinalityOneToMany';
      if(plan.mode==='junction'){
        relElements.push(relationshipXml(pascalIdent(a.name)+'_'+pascalIdent(b.name), pascalIdent(a.name), pascalIdent(b.name), card, false, 'OBJECTID', 'OBJECTID', r.name||'relaciona-se com', r.name||'relaciona-se com'));
      } else {
        const fkClass = state.classes.find(x=>x.id===plan.fkOn), refClass = state.classes.find(x=>x.id===plan.refTo);
        relElements.push(relationshipXml(pascalIdent(refClass.name)+'_'+pascalIdent(fkClass.name), pascalIdent(refClass.name), pascalIdent(fkClass.name), card, false, 'OBJECTID', sqlIdent(refClass.name)+'_id', r.name||'relaciona-se com', r.name||'relaciona-se com'));
      }
    }
  });

  const unmappedNote = unmappedSpatialNotes.length
    ? "\n  <!-- Relações espaciais sem regra real de topologia gerada (documentadas aqui, não como TopologyRule):\n       "+unmappedSpatialNotes.map(s=>'- '+s).join('\n       ')+"\n  -->\n"
    : '';

  const xml = "<?xml version='1.0' encoding='UTF-8'?>\n"
    + "<esri:Workspace xmlns:esri='http://www.esri.com/schemas/ArcGIS/10.8' xmlns:xs='http://www.w3.org/2001/XMLSchema' xmlns:xsi='http://www.w3.org/2001/XMLSchema-instance'>\n"
    + "  <!-- Gerado por GeoGeoGeo a partir de um modelo conceitual. Documento-esquema (sem dados) para\n"
    + "       importar em ArcGIS Pro / ArcCatalog: Catalog > botão direito na geodatabase > Import > XML Workspace Document.\n"
    + "       Estrutura (aninhamento em Children, caminhos /FD=.../FC=..., e a topologia com TopologyRuleType real)\n"
    + "       conferida contra um XML Workspace Document exportado de verdade do ArcGIS Pro do próprio usuário;\n"
    + "       os IDs de classe usados para ligar as regras de topologia são numeração local deste documento — o\n"
    + "       DSID real só existe depois de importado. Revise tipos de campo, comprimento de texto e o\n"
    + "       resultado da topologia após a importação. -->\n"
    + unmappedNote
    + "  <WorkspaceDefinition xsi:type='esri:WorkspaceDefinition'>\n"
    + "    <WorkspaceType>esriLocalDatabaseWorkspace</WorkspaceType>\n"
    + "    <Version></Version>\n"
    + "    <Domains xsi:type='esri:ArrayOfDomain' />\n"
    + "    <Sequences xsi:type='esri:ArrayOfSequence' />\n"
    + "    <DatasetDefinitions xsi:type='esri:ArrayOfDataElement'>\n"
    + (geoClasses.length ?
        "      <DataElement xsi:type='esri:DEFeatureDataset'><CatalogPath>/FD="+fdsName+"</CatalogPath><Name>"+fdsName+"</Name><DatasetType>esriDTFeatureDataset</DatasetType><DSID>-1</DSID><Versioned>false</Versioned><CanVersion>false</CanVersion>"+sref()
          + "<Children xsi:type='esri:ArrayOfDataElement'>\n          " + geoElements + "\n          " + topologyElement + "\n        </Children></DataElement>\n"
        : '')
    + (flatElements ? "      " + flatElements + "\n" : '')
    + (relElements.length ? "      " + relElements.join('\n      ') + "\n" : '')
    + "    </DatasetDefinitions>\n"
    + "  </WorkspaceDefinition>\n"
    + "  <WorkspaceData xsi:type='esri:WorkspaceData' />\n"
    + "</esri:Workspace>\n";
  return xml;
}

/* ============================================================
   EXPORT #1b — Script Python (arcpy) — caminho mais confiável para
   ArcGIS: usa a API estável/documentada em vez de um XML Workspace
   Document escrito à mão (formato notoriamente rígido e pouco
   documentado, cuja validação interna do ArcGIS costuma rejeitar
   documentos gerados fora do próprio ArcGIS).
   ============================================================ */
function buildArcpyScript(){
  const srid = state.meta.srid || 4326;
  const wsName = pascalIdent(state.meta.workspaceName || state.meta.name || 'ModeloOMTG');
  const geoClasses = state.classes.filter(c=>c.kind==='geo');
  const flatClasses = state.classes.filter(c=>c.kind!=='geo');
  const fdsName = wsName + '_FD';
  const L = [];

  function classIsFC(c){ return !!arcpyGeomType(geomKind(c)); }
  function classPathExpr(c){
    return classIsFC(c) ? ('os.path.join(FDS_PATH, "'+pascalIdent(c.name)+'")') : ('os.path.join(GDB_PATH, "'+pascalIdent(c.name)+'")');
  }
  function fieldLines(c, targetVar){
    computeExportFields(c).forEach(f=>{
      const t = arcpyFieldType(f.type);
      const extra = [];
      if(t==='TEXT') extra.push('field_length=255');
      if(f.nullable===false) extra.push('field_is_nullable="NON_NULLABLE"');
      const note = f.fkTable ? '  # FK -> '+f.fkTable+(f.fkNote?' ('+f.fkNote+')':'') : '';
      L.push('arcpy.management.AddField('+targetVar+', "'+f.name+'", "'+t+'"'+(extra.length?', '+extra.join(', '):'')+')'+note);
    });
  }
  function relCall(origin, dest, outName, cardinality, isComposite, fwdLabel, bwdLabel, fkField){
    L.push('arcpy.management.CreateRelationshipClass(');
    L.push('    '+classPathExpr(origin)+',');
    L.push('    '+classPathExpr(dest)+',');
    L.push('    os.path.join(GDB_PATH, "'+outName+'"),');
    L.push('    relationship_type="'+(isComposite?'COMPOSITE':'SIMPLE')+'",');
    L.push('    forward_label="'+pyStr(fwdLabel)+'",');
    L.push('    backward_label="'+pyStr(bwdLabel)+'",');
    L.push('    message_direction="NONE",');
    L.push('    cardinality="'+cardinality+'",');
    L.push('    attributed="NONE",');
    if(fkField){
      L.push('    origin_primary_key="OBJECTID",');
      L.push('    origin_foreign_key="'+fkField+'"');
    } else {
      L.push('    origin_primary_key="OBJECTID"');
    }
    L.push(')');
    L.push('');
  }

  L.push('# -*- coding: utf-8 -*-');
  L.push('"""');
  L.push('Script gerado por GeoGeoGeo — cria o esquema do modelo "'+pyStr(state.meta.name||'Modelo')+'"');
  L.push('em uma File Geodatabase usando arcpy (a API oficial e estável do ArcGIS), em vez de um');
  L.push('XML Workspace Document escrito à mão — mais confiável para importar sem erros.');
  L.push('');
  L.push('Como usar:');
  L.push('  1. Abra o ArcGIS Pro e a janela Python (Analysis > Python Window), ou rode este');
  L.push('     arquivo com o Python do ArcGIS Pro (ex.: no prompt "Python Command Prompt" do');
  L.push('     ArcGIS: python este_script.py).');
  L.push('  2. Ajuste GDB_FOLDER abaixo para a pasta onde a geodatabase deve ficar.');
  L.push('  3. Execute. O script cria a geodatabase (se ainda não existir), o feature dataset,');
  L.push('     as classes/tabelas com seus campos, as classes de relacionamento e — quando há');
  L.push('     relações "dentro" ou agregações espaciais no modelo — um dataset de Topologia com');
  L.push('     as regras de cobertura correspondentes (ver comentários "Topologia" abaixo).');
  L.push('  4. Revise tipos de campo antes de usar em produção. Nem todo predicado espacial do');
  L.push('     OMT-G tem regra de topologia equivalente no ArcGIS — os que não têm ficam como');
  L.push('     comentário explicando o motivo, não como regra criada. Regras gerais de qualidade');
  L.push('     geométrica (sem sobreposição/auto-interseção) ficam comentadas, por classe — decida');
  L.push('     você quais fazem sentido e descomente, já que nem toda classe deve proibir isso.');
  L.push('"""');
  L.push('import arcpy');
  L.push('import os');
  L.push('');
  L.push('GDB_FOLDER = r"C:\\caminho\\para\\a\\pasta"   # <-- ajuste este caminho antes de rodar');
  L.push('GDB_NAME = "'+wsName+'.gdb"');
  L.push('SRID = '+srid+'   # código EPSG do sistema de referência espacial do modelo');
  L.push('');
  L.push('GDB_PATH = os.path.join(GDB_FOLDER, GDB_NAME)');
  L.push('if not arcpy.Exists(GDB_PATH):');
  L.push('    arcpy.management.CreateFileGDB(GDB_FOLDER, GDB_NAME)');
  L.push('');
  L.push('sr = arcpy.SpatialReference(SRID)');
  L.push('');

  if(geoClasses.length){
    L.push('FDS_NAME = "'+fdsName+'"');
    L.push('FDS_PATH = os.path.join(GDB_PATH, FDS_NAME)');
    L.push('if not arcpy.Exists(FDS_PATH):');
    L.push('    arcpy.management.CreateFeatureDataset(GDB_PATH, FDS_NAME, sr)');
    L.push('');
  }

  L.push('# ---- Classes e tabelas ----');
  [...geoClasses, ...flatClasses].forEach(c=>{
    const gk = geomKind(c);
    const gt = arcpyGeomType(gk);
    const varName = pascalIdent(c.name);
    if(gt){
      L.push('# '+c.name+' ('+c.primitive+(gk.approx?' — sem equivalente vetorial direto; aproximado como '+gt:'')+')');
      L.push('arcpy.management.CreateFeatureclass(FDS_PATH, "'+varName+'", "'+gt+'", spatial_reference=sr)');
      fieldLines(c, 'os.path.join(FDS_PATH, "'+varName+'")');
    } else {
      if(c.kind==='geo') L.push('# '+c.name+': primitiva "'+c.primitive+'" não tem equivalente direto de geometria no arcpy — criada como tabela; adicione a geometria manualmente se necessário.');
      else L.push('# '+c.name);
      L.push('arcpy.management.CreateTable(GDB_PATH, "'+varName+'")');
      fieldLines(c, 'os.path.join(GDB_PATH, "'+varName+'")');
    }
    L.push('');
  });

  // Coverage candidates for the Topology dataset: an explicit "dentro"
  // spatial relationship, OR an aggregation between two classes that both
  // have geometry — a whole/part pair where both sides are mapped features
  // (e.g. a neighborhood aggregating blocks) behaves, geometrically, exactly
  // like "part dentro do todo", even though it's drawn as aggregation, not
  // as the OMT-G spatial-relationship notation. Aggregation's own forward
  // label is "agrega" (source aggregates target — source is the whole), so
  // the part being covered is the TARGET and the whole is the SOURCE.
  const coverageCandidates = [];
  L.push('# ---- Classes de relacionamento ----');
  state.relationships.forEach(r=>{
    const a = state.classes.find(x=>x.id===r.sourceId), b = state.classes.find(x=>x.id===r.targetId);
    if(!a || !b) return;
    if(r.type==='generalization'){
      relCall(b, a, pascalIdent(a.name)+'_Generaliza_'+pascalIdent(b.name), 'ONE_TO_ONE', true, 'é especializada por', 'especializa', sqlIdent(b.name)+'_id');
    } else if(r.type==='aggregation'){
      relCall(a, b, pascalIdent(a.name)+'_Agrega_'+pascalIdent(b.name), 'ONE_TO_MANY', true, 'agrega', 'é parte de', sqlIdent(a.name)+'_id');
      if(geomKind(a) && geomKind(b)){
        coverageCandidates.push({origin:b, dest:a, predicate:'dentro', label:b.name+' contido em '+a.name+' (agregação espacial)'});
      }
    } else if(r.type==='network'){
      relCall(a, b, pascalIdent(a.name)+'_ConectaOrigem_'+pascalIdent(b.name), 'ONE_TO_MANY', false, 'é origem de', 'parte de (nó origem)', sqlIdent(a.name)+'_no_origem_id');
      relCall(a, b, pascalIdent(a.name)+'_ConectaDestino_'+pascalIdent(b.name), 'ONE_TO_MANY', false, 'é destino de', 'parte de (nó destino)', sqlIdent(a.name)+'_no_destino_id');
    } else if(r.type==='association'){
      const plan = associationPlan(r);
      if(plan.mode==='junction'){
        L.push('# associação N:N "'+(r.name||'')+'" ('+a.name+' <-> '+b.name+') — sem atributos próprios;');
        L.push('# o arcpy cria e gerencia a tabela de junção internamente.');
        relCall(a, b, pascalIdent(a.name)+'_'+pascalIdent(b.name), 'MANY_TO_MANY', false, r.name||'relaciona-se com', r.name||'relaciona-se com', null);
      } else {
        const fkClass = state.classes.find(x=>x.id===plan.fkOn), refClass = state.classes.find(x=>x.id===plan.refTo);
        relCall(refClass, fkClass, pascalIdent(refClass.name)+'_'+pascalIdent(fkClass.name), 'ONE_TO_MANY', false, r.name||'relaciona-se com', r.name||'relaciona-se com', sqlIdent(refClass.name)+'_id');
      }
    } else if(r.type==='spatial'){
      if(geomKind(a) && geomKind(b)){
        coverageCandidates.push({origin:a, dest:b, predicate:r.topoRule, label:a.name+' '+TOPO_RULE_LABEL[r.topoRule]+' '+b.name});
      } else {
        coverageCandidates.push({origin:a, dest:b, predicate:r.topoRule, label:a.name+' '+TOPO_RULE_LABEL[r.topoRule]+' '+b.name, noGeom:true});
      }
    }
  });

  const areaLineGeo = geoClasses.filter(c=>{ const cat = geomCategory(c); return cat==='area'||cat==='line'; });
  if(areaLineGeo.length || coverageCandidates.length){
    L.push('# ---- Topologia ----');
    L.push('# Um dataset de Topologia do ArcGIS guarda regras de INTEGRIDADE entre classes');
    L.push('# inteiras (ex.: "feições de A não podem sobrepor feições de B"), não afirmações');
    L.push('# sobre um par específico de feições. As regras abaixo vêm de dois lugares');
    L.push('# diferentes: regras de cobertura, criadas de verdade porque vêm de uma relação');
    L.push('# "dentro" ou de uma agregação espacial que você desenhou no modelo (a parte deve');
    L.push('# estar coberta pelo todo); e regras gerais de qualidade geométrica (sem sobrepor/');
    L.push('# auto-interceptar), que ficam só como SUGESTÃO comentada — se uma classe de área');
    L.push('# pode legitimamente ter feições sobrepostas (zoneamentos, camadas de classificação');
    L.push('# distintas sobre a mesma área etc.), aplicar isso de forma automática estaria errado;');
    L.push('# só quem conhece a regra de negócio da classe sabe se cabe. Descomente por classe.');
    L.push('# O vocabulário do ArcGIS é quase todo negativo/de cobertura ("não pode sobrepor",');
    L.push('# "deve estar coberto por/dentro de"); não existe regra para "deve tocar", "deve');
    L.push('# sobrepor" ou "deve cruzar" — esses predicados ficam só como comentário, não porque');
    L.push('# faltou implementar, mas porque o ArcGIS não tem regra equivalente.');
    // ArcGIS Pro's own default name for a topology created inside a dataset
    // is "<dataset>_Topology" (confirmed by the user's real export), not
    // "<workspace>_Topology" — matched here for consistency with the XML
    // export and with what ArcGIS Pro itself would suggest.
    const topoName = fdsName+'_Topology';
    L.push('TOPOLOGY_NAME = "'+topoName+'"');
    L.push('TOPOLOGY_PATH = os.path.join(FDS_PATH, TOPOLOGY_NAME)');
    L.push('arcpy.management.CreateTopology(FDS_PATH, TOPOLOGY_NAME)');
    const addedFC = new Set();
    const addFC = c=>{
      const v = pascalIdent(c.name);
      if(!addedFC.has(v)){ addedFC.add(v); L.push('arcpy.management.AddFeatureClassToTopology(TOPOLOGY_PATH, os.path.join(FDS_PATH, "'+v+'"), 1, 1)'); }
    };
    // Only classes with an actual, model-derived coverage rule are added to
    // the topology automatically — that reflects a containment relationship
    // you drew. A class gets added for a general rule only when its
    // suggestion below is uncommented.
    coverageCandidates.forEach(({origin,dest,noGeom})=>{ if(!noGeom){ addFC(origin); addFC(dest); } });
    L.push('');
    if(areaLineGeo.length){
      L.push('# Sugestões de qualidade geométrica (comentadas — decida por classe e descomente):');
      areaLineGeo.forEach(c=>{
        const v = pascalIdent(c.name);
        generalTopologyRules(geomCategory(c)).forEach(({rule})=>{
          L.push('# arcpy.management.AddFeatureClassToTopology(TOPOLOGY_PATH, os.path.join(FDS_PATH, "'+v+'"), 1, 1)  # se ainda não adicionada acima');
          L.push('# arcpy.management.AddRuleToTopology(TOPOLOGY_PATH, "'+rule+'", os.path.join(FDS_PATH, "'+v+'"), "", "", "")');
        });
      });
      L.push('# "Must Not Have Gaps (Area)" também é só sugestão — faz sentido para uma classe');
      L.push('# que deve cobrir totalmente sua extensão sem buracos (ex.: bairros dentro do');
      L.push('# limite do município), não para uma que pode ter vazios legítimos (ex.: lotes,');
      L.push('# já que nem todo terreno é um lote registrado):');
      L.push('# arcpy.management.AddRuleToTopology(TOPOLOGY_PATH,');
      L.push('#   "Must Not Have Gaps (Area)", os.path.join(FDS_PATH, "<Classe>"), "", "", "")');
      L.push('');
    }
    if(coverageCandidates.length){
      L.push('# Regras de cobertura (relações "dentro" e agregações espaciais):');
      coverageCandidates.forEach(({origin,dest,predicate,label,noGeom})=>{
        if(noGeom){
          L.push('# '+label+' — uma das classes não tem geometria; sem regra de topologia.');
          L.push('');
          return;
        }
        const catA = geomCategory(origin), catB = geomCategory(dest);
        const mapped = topologyRuleFor(predicate, catA, catB);
        if(mapped){
          L.push('# '+label+(mapped.caveat ? '  ('+mapped.caveat+')' : ''));
          L.push('arcpy.management.AddRuleToTopology(TOPOLOGY_PATH, "'+mapped.rule+'", os.path.join(FDS_PATH, "'+pascalIdent(origin.name)+'"), "", os.path.join(FDS_PATH, "'+pascalIdent(dest.name)+'"), "")');
        } else {
          L.push('# '+label+' — predicado "'+(TOPO_RULE_SHORT[predicate]||predicate)+'" sem regra de');
          L.push('#   topologia equivalente no ArcGIS (ver nota acima); documente/valide separadamente.');
        }
        L.push('');
      });
    }
    L.push('arcpy.management.ValidateTopology(TOPOLOGY_PATH, "Full_Extent")');
    L.push('');
  }

  L.push('print("Esquema criado em: " + GDB_PATH)');
  return L.join('\n');
}

/* ============================================================
   EXPORT — Geodatabase via GDAL/OGR (OpenFileGDB driver)
   Writes a real .gdb using only open-source tooling — no ArcGIS Pro
   license needed. GDAL's OpenFileGDB driver has supported writing since
   3.6, including relationship classes (also added in 3.6); as of GDAL
   3.11 it's the driver Esri's own name delegates to for all writes. Field
   names/types mirror computeExportFields() exactly, so this stays
   consistent with the arcpy script and the SQL exports.
   ============================================================ */
function buildGdalScript(){
  const srid = state.meta.srid || 4326;
  const wsName = pascalIdent(state.meta.workspaceName || state.meta.name || 'ModeloOMTG');
  const geoClasses = state.classes.filter(c=>c.kind==='geo');
  const flatClasses = state.classes.filter(c=>c.kind!=='geo');
  const fdsName = wsName + '_FD';
  const L = [];

  function classIsFC(c){ return !!ogrGeomType(geomKind(c)); }
  function layerVar(c){ return 'lyr_'+pascalIdent(c.name); }
  function fieldLines(c, lv){
    computeExportFields(c).forEach(f=>{
      const t = ogrFieldType(f.type);
      const note = f.fkTable ? '  # FK -> '+f.fkTable+(f.fkNote?' ('+f.fkNote+')':'') : '';
      L.push('fld = ogr.FieldDefn("'+f.name+'", '+t+')');
      if(f.type==='text') L.push('fld.SetWidth(255)');
      if(f.type==='boolean') L.push('fld.SetSubType(ogr.OFSTBoolean)');
      L.push('fld.SetNullable('+(f.nullable===false?'False':'True')+')');
      L.push(lv+'.CreateField(fld)'+note);
    });
  }
  // origin = the "1"/referenced side (holds the primary key used as the
  // relationship's join field), dest = the "many"/referencing side (holds
  // the FK field computeExportFields() actually added on that table).
  function relCall(origin, dest, outName, cardinalityConst, isComposite, fwdLabel, bwdLabel, originKeyField, fkField){
    L.push('rel = gdal.Relationship("'+outName+'", "'+pascalIdent(origin.name)+'", "'+pascalIdent(dest.name)+'", gdal.'+cardinalityConst+')');
    L.push('rel.SetType(gdal.'+(isComposite?'GRT_COMPOSITE':'GRT_ASSOCIATION')+')');
    L.push('rel.SetForwardPathLabel("'+pyStr(fwdLabel)+'")');
    L.push('rel.SetBackwardPathLabel("'+pyStr(bwdLabel)+'")');
    L.push('rel.SetLeftTableFields(["'+originKeyField+'"])');
    L.push('rel.SetRightTableFields(["'+(fkField||originKeyField)+'"])');
    L.push('rel.SetRelatedTableType("features")');
    L.push('add_relationship(ds, rel, "'+outName+'")');
    L.push('');
  }

  L.push('# -*- coding: utf-8 -*-');
  L.push('"""');
  L.push('Script gerado por GeoGeoGeo — cria o esquema do modelo "'+pyStr(state.meta.name||'Modelo')+'"');
  L.push('em uma File Geodatabase (.gdb) real usando GDAL/OGR (o driver OpenFileGDB),');
  L.push('sem precisar do ArcGIS Pro nem de nenhuma licença Esri — só GDAL, que é');
  L.push('gratuito e de código aberto.');
  L.push('');
  L.push('*** IMPORTANTE — leia antes de rodar ***');
  L.push('Escrita de esquema (classes, tabelas, campos) no OpenFileGDB é suportada desde');
  L.push('o GDAL 3.6 e é uma API estável — essa parte deste script tem alta confiança.');
  L.push('A API de relationship classes (gdal.Relationship / Dataset.AddRelationship)');
  L.push('também foi adicionada no GDAL 3.6, mas eu não consegui confirmar a assinatura');
  L.push('exata (nomes/ordem dos parâmetros) contra a documentação ao vívo ao gerar este');
  L.push('script — por segurança, a criação de cada relacionamento roda dentro de um');
  L.push('try/except: se a chamada falhar por causa de uma diferença de versão, o');
  L.push('script AVISA no terminal e continua (a geodatabase e todas as classes/tabelas');
  L.push('são criadas normalmente de qualquer forma). Se algum relacionamento falhar,');
  L.push('rode isto para conferir a assinatura certa da sua versão instalada e ajuste');
  L.push('a função add_relationship() abaixo:');
  L.push('    python3 -c "from osgeo import gdal; help(gdal.Relationship)"');
  L.push('    python3 -c "from osgeo import gdal; help(gdal.Dataset.AddRelationship)"');
  L.push('');
  L.push('Requisitos (não precisa ArcGIS):');
  L.push('  pip install gdal        # ou: conda install -c conda-forge gdal');
  L.push('  — confira que a versão é >= 3.6 (idealmente >= 3.11):');
  L.push('      python3 -c "from osgeo import gdal; print(gdal.__version__)"');
  L.push('');
  L.push('Como usar:');
  L.push('  1. Ajuste GDB_FOLDER abaixo para a pasta onde a geodatabase deve ficar.');
  L.push('  2. Rode: python3 este_script.py');
  L.push('  3. Revise tipos de campo e o esquema de topologia sugerido nos comentários');
  L.push('     antes de usar em produção — em especial as relações espaciais, que viram');
  L.push('     apenas comentários de orientação (GDAL não modela topologia).');
  L.push('"""');
  L.push('import os');
  L.push('from osgeo import gdal, ogr, osr');
  L.push('');
  L.push('gdal.UseExceptions()');
  L.push('');
  L.push('GDB_FOLDER = r"/caminho/para/a/pasta"   # <-- ajuste este caminho antes de rodar');
  L.push('GDB_NAME = "'+wsName+'.gdb"');
  L.push('SRID = '+srid+'   # código EPSG do sistema de referência espacial do modelo');
  L.push('');
  L.push('GDB_PATH = os.path.join(GDB_FOLDER, GDB_NAME)');
  L.push('');
  L.push('def add_relationship(ds, rel, name):');
  L.push('    try:');
  L.push('        ok = ds.AddRelationship(rel)');
  L.push('        if not ok:');
  L.push('            print("Aviso: AddRelationship recusou o relacionamento \'" + name + "\' "');
  L.push('                  "(retornou False) — confira campos/tabelas envolvidos.")');
  L.push('    except Exception as e:');
  L.push('        print("Aviso: não foi possível criar o relacionamento \'" + name + "\': " + str(e))');
  L.push('        print("       Confira a assinatura da API de relationships da sua versão do GDAL")');
  L.push('        print("       (veja o comentário no topo deste arquivo) e ajuste add_relationship().")');
  L.push('');
  L.push('srs = osr.SpatialReference()');
  L.push('srs.ImportFromEPSG(SRID)');
  L.push('');
  L.push('drv = ogr.GetDriverByName("OpenFileGDB")');
  L.push('ds = drv.CreateDataSource(GDB_PATH)');
  L.push('');

  L.push('# ---- Classes e tabelas ----');
  [...geoClasses, ...flatClasses].forEach(c=>{
    const gk = geomKind(c);
    const gt = ogrGeomType(gk);
    const lv = layerVar(c);
    const opts = [];
    if(gt && c.kind==='geo') opts.push('"FEATURE_DATASET='+fdsName+'"');
    const optsStr = opts.length ? ', options=['+opts.join(', ')+']' : '';
    if(gt){
      L.push('# '+c.name+' ('+c.primitive+(gk.approx?' — sem equivalente vetorial direto; aproximado como '+gt.replace('ogr.wkb',''):'')+')');
      L.push(lv+' = ds.CreateLayer("'+pascalIdent(c.name)+'", srs=srs, geom_type='+gt+optsStr+')');
    } else {
      if(c.kind==='geo') L.push('# '+c.name+': primitiva "'+c.primitive+'" não tem equivalente direto de geometria no OGR — criada como tabela; adicione a geometria manualmente se necessário.');
      else L.push('# '+c.name);
      L.push(lv+' = ds.CreateLayer("'+pascalIdent(c.name)+'", geom_type=ogr.wkbNone)');
    }
    fieldLines(c, lv);
    L.push('');
  });

  const spatialNotes = [];
  L.push('# ---- Relacionamentos ----');
  state.relationships.forEach(r=>{
    const a = state.classes.find(x=>x.id===r.sourceId), b = state.classes.find(x=>x.id===r.targetId);
    if(!a || !b) return;
    if(r.type==='generalization'){
      relCall(b, a, pascalIdent(a.name)+'_Generaliza_'+pascalIdent(b.name), 'GRC_ONE_TO_ONE', true, 'é especializada por', 'especializa', 'OBJECTID', sqlIdent(b.name)+'_id');
    } else if(r.type==='aggregation'){
      relCall(a, b, pascalIdent(a.name)+'_Agrega_'+pascalIdent(b.name), 'GRC_ONE_TO_MANY', true, 'agrega', 'é parte de', 'OBJECTID', sqlIdent(a.name)+'_id');
    } else if(r.type==='network'){
      relCall(a, b, pascalIdent(a.name)+'_ConectaOrigem_'+pascalIdent(b.name), 'GRC_ONE_TO_MANY', false, 'é origem de', 'parte de (nó origem)', 'OBJECTID', sqlIdent(a.name)+'_no_origem_id');
      relCall(a, b, pascalIdent(a.name)+'_ConectaDestino_'+pascalIdent(b.name), 'GRC_ONE_TO_MANY', false, 'é destino de', 'parte de (nó destino)', 'OBJECTID', sqlIdent(a.name)+'_no_destino_id');
    } else if(r.type==='association'){
      const plan = associationPlan(r);
      if(plan.mode==='junction'){
        L.push('# associação N:N "'+(r.name||'')+'" ('+a.name+' <-> '+b.name+') — o GDAL/OGR não gerencia');
        L.push('# uma tabela de junção automaticamente como o arcpy; crie manualmente uma tabela');
        L.push('# de junção com os IDs das duas classes e dois relacionamentos ONE_TO_MANY.');
      } else {
        const fkClass = state.classes.find(x=>x.id===plan.fkOn), refClass = state.classes.find(x=>x.id===plan.refTo);
        relCall(refClass, fkClass, pascalIdent(refClass.name)+'_'+pascalIdent(fkClass.name), 'GRC_ONE_TO_MANY', false, r.name||'relaciona-se com', r.name||'relaciona-se com', 'OBJECTID', sqlIdent(refClass.name)+'_id');
      }
    } else if(r.type==='spatial'){
      spatialNotes.push(a.name+' '+TOPO_RULE_LABEL[r.topoRule]+' '+b.name);
    }
  });

  if(spatialNotes.length){
    L.push('# ---- Regras de topologia (relações espaciais do modelo conceitual) ----');
    L.push('# O GDAL não modela topologia — recomenda-se validar estas regras separadamente');
    L.push('# (ex.: com um dataset de Topologia no ArcGIS Pro, ou regras QGIS/PostGIS) usando');
    L.push('# esta lista como guia:');
    spatialNotes.forEach(s=>L.push('#   - '+s));
    L.push('');
  }

  L.push('ds = None');
  L.push('print("Geodatabase criada em: " + GDB_PATH)');
  return L.join('\n');
}

function pkFieldName(c){
  const pk = c.attributes.find(a=>a.pk);
  return pk ? sqlIdent(pk.name) : 'id';
}
function tblName(c){ return sqlIdent(c.name); }

/* ============================================================
   EXPORT #2 — GeoPackage (SQL DDL, OGC GeoPackage 1.2/1.3 system tables)
   ============================================================ */
function buildGpkgSql(){
  const srid = state.meta.srid || 4326;
  const authority = state.meta.srsAuthority || 'EPSG';
  const lines = [];
  lines.push('-- ============================================================');
  lines.push('-- GeoPackage (OGC) — DDL gerado por GeoGeoGeo');
  lines.push('-- Como usar: crie um GeoPackage vazio (ex.: QGIS > Novo > GeoPackage,');
  lines.push('-- ou "ogrinfo -so out.gpkg" após criação), abra o arquivo com um cliente');
  lines.push('-- SQLite (DB Browser for SQLite) e execute este script inteiro.');
  lines.push('-- ============================================================\n');

  lines.push('CREATE TABLE IF NOT EXISTS gpkg_spatial_ref_sys (');
  lines.push('  srs_name TEXT NOT NULL, srs_id INTEGER NOT NULL PRIMARY KEY,');
  lines.push('  organization TEXT NOT NULL, organization_coordsys_id INTEGER NOT NULL,');
  lines.push('  definition TEXT NOT NULL, description TEXT);\n');
  lines.push('CREATE TABLE IF NOT EXISTS gpkg_contents (');
  lines.push('  table_name TEXT NOT NULL PRIMARY KEY, data_type TEXT NOT NULL,');
  lines.push('  identifier TEXT UNIQUE, description TEXT DEFAULT \'\',');
  lines.push('  last_change DATETIME NOT NULL DEFAULT (strftime(\'%Y-%m-%dT%H:%M:%fZ\',\'now\')),');
  lines.push('  min_x DOUBLE, min_y DOUBLE, max_x DOUBLE, max_y DOUBLE, srs_id INTEGER,');
  lines.push('  FOREIGN KEY (srs_id) REFERENCES gpkg_spatial_ref_sys(srs_id));\n');
  lines.push('CREATE TABLE IF NOT EXISTS gpkg_geometry_columns (');
  lines.push('  table_name TEXT NOT NULL, column_name TEXT NOT NULL, geometry_type_name TEXT NOT NULL,');
  lines.push('  srs_id INTEGER NOT NULL, z TINYINT NOT NULL, m TINYINT NOT NULL,');
  lines.push('  PRIMARY KEY (table_name, column_name),');
  lines.push('  FOREIGN KEY (table_name) REFERENCES gpkg_contents(table_name),');
  lines.push('  FOREIGN KEY (srs_id) REFERENCES gpkg_spatial_ref_sys(srs_id));\n');

  lines.push("INSERT OR IGNORE INTO gpkg_spatial_ref_sys VALUES ('Undefined cartesian SRS', -1, 'NONE', -1, 'undefined', 'undefined cartesian coordinate reference system');");
  lines.push("INSERT OR IGNORE INTO gpkg_spatial_ref_sys VALUES ('Undefined geographic SRS', 0, 'NONE', 0, 'undefined', 'undefined geographic coordinate reference system');");
  lines.push("INSERT OR IGNORE INTO gpkg_spatial_ref_sys VALUES ('WGS 84 geodetic', 4326, 'EPSG', 4326, 'GEOGCRS[\"WGS 84\"]', 'longitude/latitude WGS84');");
  if(srid!==4326 && srid!==0 && srid!==-1){
    lines.push("INSERT OR IGNORE INTO gpkg_spatial_ref_sys VALUES ('"+authority+':'+srid+"', "+srid+", '"+authority+"', "+srid+", 'definir WKT do SRID "+srid+" manualmente se necessario', 'SRS do modelo (SRID "+srid+")');");
  }
  lines.push('');

  state.classes.forEach(c=>{
    const table = tblName(c);
    const fields = computeExportFields(c);
    const pkName = pkFieldName(c);
    const gk = geomKind(c);
    const cols = [];
    cols.push('  "'+pkName+'" INTEGER PRIMARY KEY AUTOINCREMENT');
    fields.filter(f=>f.name!==pkName).forEach(f=>{
      let refClass = f.fkClassId ? state.classes.find(x=>x.id===f.fkClassId) : null;
      const refCol = refClass ? pkFieldName(refClass) : 'id';
      cols.push('  "'+f.name+'" '+gpkgType(f.type)+(f.nullable===false?' NOT NULL':'')+(refClass ? ' REFERENCES "'+tblName(refClass)+'"("'+refCol+'") /* '+(f.fkNote||'')+' */' : ''));
    });
    if(gk) cols.push('  "geom" BLOB /* geometria '+gk.ogc+(gk.approx?' - aproximação; primitiva conceitual: '+c.primitive:'')+' */');
    lines.push('CREATE TABLE "'+table+'" (\n'+cols.join(',\n')+'\n);');
    if(gk){
      lines.push("INSERT INTO gpkg_contents (table_name, data_type, identifier, description, srs_id) VALUES ('"+table+"', 'features', '"+table+"', '"+(c.name.replace(/'/g,"''"))+"', "+srid+");");
      lines.push("INSERT INTO gpkg_geometry_columns (table_name, column_name, geometry_type_name, srs_id, z, m) VALUES ('"+table+"', 'geom', '"+gk.ogc+"', "+srid+", 0, 0);");
    } else {
      lines.push("INSERT INTO gpkg_contents (table_name, data_type, identifier, description) VALUES ('"+table+"', 'attributes', '"+table+"', '"+(c.name.replace(/'/g,"''"))+"');");
    }
    lines.push('');
  });

  const junctions = [];
  state.relationships.forEach(r=>{
    if(r.type!=='association') return;
    const plan = associationPlan(r);
    if(plan.mode!=='junction') return;
    const a = state.classes.find(x=>x.id===r.sourceId), b = state.classes.find(x=>x.id===r.targetId);
    const jt = tblName(a)+'_'+tblName(b);
    junctions.push('CREATE TABLE "'+jt+'" (\n  "'+tblName(a)+'_id" INTEGER NOT NULL REFERENCES "'+tblName(a)+'"("'+pkFieldName(a)+'"),\n  "'+tblName(b)+'_id" INTEGER NOT NULL REFERENCES "'+tblName(b)+'"("'+pkFieldName(b)+'"),\n  PRIMARY KEY ("'+tblName(a)+'_id", "'+tblName(b)+'_id")\n); -- associação N:N'+(r.name?' ('+r.name+')':''));
  });
  if(junctions.length){ lines.push('-- Tabelas de junção (associações N:N)'); junctions.forEach(j=>lines.push(j+'\n')); }

  const spatialNotes = state.relationships.filter(r=>r.type==='spatial').map(r=>{
    const a = state.classes.find(x=>x.id===r.sourceId), b = state.classes.find(x=>x.id===r.targetId);
    return (a&&b) ? ('-- '+a.name+' '+TOPO_RULE_LABEL[r.topoRule]+' '+b.name) : null;
  }).filter(Boolean);
  if(spatialNotes.length){
    lines.push('-- Relações espaciais / topológicas do modelo conceitual (documentação — o GeoPackage');
    lines.push('-- não possui um mecanismo nativo de regras topológicas; valide estas regras na aplicação');
    lines.push('-- ou com rotinas de QA em QGIS/GDAL):');
    spatialNotes.forEach(n=>lines.push(n));
  }
  return lines.join('\n');
}

/* ============================================================
   EXPORT #3 — PostGIS (SQL DDL + esquema opcional postgis.topology)
   ============================================================ */
function buildPostgisSql(opts){
  opts = opts || {};
  const srid = state.meta.srid || 4326;
  const schema = sqlIdent(state.meta.schema || 'public');
  const useTopology = !!opts.useTopology;
  const lines = [];
  lines.push('-- ============================================================');
  lines.push('-- PostGIS — DDL gerado por GeoGeoGeo');
  lines.push('-- Requer as extensões postgis'+(useTopology?' e postgis_topology':'')+'.');
  lines.push('-- ============================================================\n');
  lines.push('CREATE EXTENSION IF NOT EXISTS postgis;');
  if(useTopology) lines.push('CREATE EXTENSION IF NOT EXISTS postgis_topology;');
  if(schema!=='public') lines.push('CREATE SCHEMA IF NOT EXISTS "'+schema+'";');
  lines.push('');

  const topoName = sqlIdent(state.meta.workspaceName||state.meta.name||'modelo')+'_topo';
  const networkOrTopoClasses = state.classes.filter(c=>c.kind==='geo' && (c.primitive==='node' || c.primitive==='arc'));
  if(useTopology && networkOrTopoClasses.length){
    lines.push('-- Esquema de topologia PostGIS para as classes de rede (nó/arco)');
    lines.push("SELECT topology.CreateTopology('"+topoName+"', "+srid+");");
    lines.push('');
  }

  const deferredFks = [];
  state.classes.forEach(c=>{
    const table = tblName(c);
    const fields = computeExportFields(c);
    const pkName = pkFieldName(c);
    const gk = geomKind(c);
    const cols = [];
    cols.push('  "'+pkName+'" serial PRIMARY KEY');
    fields.filter(f=>f.name!==pkName).forEach(f=>{
      let refClass = f.fkClassId ? state.classes.find(x=>x.id===f.fkClassId) : null;
      const refCol = refClass ? pkFieldName(refClass) : 'id';
      cols.push('  "'+f.name+'" '+pgType(f.type)+(f.nullable===false?' NOT NULL':''));
      if(refClass) deferredFks.push({table, col:f.name, refTable:tblName(refClass), refCol, note:f.fkNote||''});
    });
    if(gk && !(useTopology && (c.primitive==='node'||c.primitive==='arc'))){
      cols.push('  geom geometry('+gk.ogc+', '+srid+')'+(gk.approx?' /* aproximação; primitiva conceitual: '+c.primitive+' */':''));
    }
    lines.push('CREATE TABLE "'+schema+'"."'+table+'" (\n'+cols.join(',\n')+'\n);');
    if(gk && !(useTopology && (c.primitive==='node'||c.primitive==='arc'))){
      lines.push('CREATE INDEX "'+table+'_geom_idx" ON "'+schema+'"."'+table+'" USING GIST (geom);');
    }
    if(useTopology && (c.primitive==='node'||c.primitive==='arc')){
      lines.push("SELECT topology.AddTopoGeometryColumn('"+topoName+"', '"+schema+"', '"+table+"', 'topo_geom', '"+(c.primitive==='node'?'POINT':'LINESTRING')+"');");
    }
    lines.push('');
  });

  if(deferredFks.length){
    lines.push('-- Chaves estrangeiras (declaradas após a criação de todas as tabelas, para não depender da ordem das classes)');
    deferredFks.forEach(fk=>{
      const cname = fk.table+'_'+fk.col+'_fkey';
      lines.push('ALTER TABLE "'+schema+'"."'+fk.table+'" ADD CONSTRAINT "'+cname+'" FOREIGN KEY ("'+fk.col+'") REFERENCES "'+schema+'"."'+fk.refTable+'"("'+fk.refCol+'");'+(fk.note?' -- '+fk.note:''));
    });
    lines.push('');
  }

  const junctions = [];
  state.relationships.forEach(r=>{
    if(r.type!=='association') return;
    const plan = associationPlan(r);
    if(plan.mode!=='junction') return;
    const a = state.classes.find(x=>x.id===r.sourceId), b = state.classes.find(x=>x.id===r.targetId);
    const jt = tblName(a)+'_'+tblName(b);
    junctions.push('CREATE TABLE "'+schema+'"."'+jt+'" (\n  "'+tblName(a)+'_id" integer NOT NULL REFERENCES "'+schema+'"."'+tblName(a)+'"("'+pkFieldName(a)+'") ON DELETE CASCADE,\n  "'+tblName(b)+'_id" integer NOT NULL REFERENCES "'+schema+'"."'+tblName(b)+'"("'+pkFieldName(b)+'") ON DELETE CASCADE,\n  PRIMARY KEY ("'+tblName(a)+'_id", "'+tblName(b)+'_id")\n); -- associação N:N'+(r.name?' ('+r.name+')':''));
  });
  if(junctions.length){ lines.push('-- Tabelas de junção (associações N:N)'); junctions.forEach(j=>lines.push(j+'\n')); }

  const spatialRels = state.relationships.filter(r=>r.type==='spatial');
  if(spatialRels.length){
    lines.push('-- ------------------------------------------------------------');
    lines.push('-- Regras de topologia / relações espaciais do modelo conceitual');
    lines.push('-- Implementadas como gatilhos de validação (constraint triggers) usando PostGIS.');
    lines.push('-- Ajuste a coluna de geometria caso os nomes das tabelas mudem.');
    lines.push('-- ------------------------------------------------------------');
    // mapeia os 7 predicados oficiais do OMT-G para as funções PostGIS equivalentes
    const fnDef = {
      touches:   {fn:'ST_Touches'},
      dentro:    {fn:'ST_Within'},
      disjunto:  {fn:'ST_Disjoint'},
      sobrepoe:  {fn:'ST_Overlaps'},
      cruza:     {fn:'ST_Crosses'},
      proximo:   {fn:'ST_DWithin', extra:', 100', note:"'próximo' usa ST_DWithin com distância de exemplo (100, nas unidades do SRID) — ajuste o limiar conforme a escala do seu modelo."},
      em_frente: {fn:'ST_Intersects', note:"'em frente' é uma relação de orientação/adjacência sem predicado espacial direto no PostGIS; ST_Intersects é usado apenas como aproximação — ajuste a lógica manualmente se precisar de um teste mais específico (ex.: buffer + ST_Azimuth)."}
    };
    spatialRels.forEach((r,i)=>{
      const a = state.classes.find(x=>x.id===r.sourceId), b = state.classes.find(x=>x.id===r.targetId);
      if(!a||!b) return;
      const def = fnDef[r.topoRule] || {fn:'ST_Intersects'};
      const fn = def.fn, extra = def.extra || '';
      const fname = 'chk_'+tblName(a)+'_'+r.topoRule+'_'+tblName(b);
      if(def.note) lines.push('-- '+def.note);
      lines.push('CREATE OR REPLACE FUNCTION "'+schema+'".'+fname+'() RETURNS trigger AS $$');
      lines.push('BEGIN');
      lines.push('  IF EXISTS (');
      lines.push('    SELECT 1 FROM "'+schema+'"."'+tblName(b)+'" b');
      lines.push('    WHERE NOT '+fn+'(NEW.geom, b.geom'+extra+')');
      lines.push('  ) THEN');
      lines.push("    RAISE WARNING '% pode violar a regra espacial % com %', TG_TABLE_NAME, '"+r.topoRule+"', '"+tblName(b)+"';");
      lines.push('  END IF;');
      lines.push('  RETURN NEW;');
      lines.push('END;');
      lines.push('$$ LANGUAGE plpgsql;');
      lines.push('-- Ative com: CREATE CONSTRAINT TRIGGER '+fname+'_trg AFTER INSERT OR UPDATE ON "'+schema+'"."'+tblName(a)+'"');
      lines.push('--   FOR EACH ROW EXECUTE FUNCTION "'+schema+'".'+fname+'();  -- ('+a.name+' '+TOPO_RULE_LABEL[r.topoRule]+' '+b.name+')');
      lines.push('');
    });
  }
  return lines.join('\n');
}

function miniField(label, value, type, onInput){
  const inp = E('input',{type:type, value:(value==null?'':value), oninput:(e)=>onInput(e.target.value)});
  return E('div',{class:'field'},[E('label',{},[label]), inp]);
