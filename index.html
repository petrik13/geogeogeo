<title>GeoGeoGeo</title>
<meta name="description" content="Editor visual de modelos OMT-G com exportação para Geodatabase (ArcGIS ou GDAL puro, com relationship classes), GeoPackage e PostGIS.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* ============ Design tokens ============ */
  :root{
    --bg:#eef1ef;
    --surface:#ffffff;
    --surface-2:#e3e9e6;
    --surface-3:#d7ded9;
    --border:#c7d0cb;
    --ink:#16211d;
    --ink-soft:#45534c;
    --muted:#6d7d75;
    --accent:#0c6478;
    --accent-ink:#ffffff;
    --accent-soft:#e3f0f1;
    --good:#2f8f4e;
    --warn:#a86a12;
    --bad:#b5432f;
    --bad-soft:#f7e6e1;
    --shadow:0 1px 2px rgba(20,30,26,.06), 0 6px 20px -8px rgba(20,30,26,.18);
    --canvas-bg:#ffffff;
    --canvas-grid:rgba(28,36,32,.06);
    --canvas-grid-major:rgba(28,36,32,.11);
    --canvas-ink:#3a453e;
    --canvas-line:#0c6478;
    --canvas-card:#fbfbf9;
    --canvas-card-ink:#1c2420;
    --canvas-card-border:#d7ddd2;
    --canvas-card-name:#2f6fed;
    --canvas-chip-bg:rgba(12,100,120,.10);
    --canvas-required:#d64545;
    --canvas-toolbar-bg:rgba(20,30,26,.05);
    --canvas-toolbar-hover:rgba(20,30,26,.10);
    --canvas-toolbar-border:rgba(20,30,26,.14);
    --edge-association:#64748b;
    --edge-generalization:#111318;
    --edge-aggregation:#0e7490;
    --edge-network:#b45309;
    --edge-spatial:#7c3aed;
    --radius:10px;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#12181a;
      --surface:#181f22;
      --surface-2:#1e2629;
      --surface-3:#26302f;
      --border:#2c3739;
      --ink:#e9ede9;
      --ink-soft:#b9c3bd;
      --muted:#84928b;
      --accent:#4fc3d3;
      --accent-ink:#08191c;
      --accent-soft:#173137;
      --good:#57c67c;
      --warn:#d9a441;
      --bad:#e2735c;
      --bad-soft:#3a2420;
      --shadow:0 1px 2px rgba(0,0,0,.35), 0 10px 30px -12px rgba(0,0,0,.55);
    }
  }
  :root[data-theme="dark"]{
    --bg:#12181a;
    --surface:#181f22;
    --surface-2:#1e2629;
    --surface-3:#26302f;
    --border:#2c3739;
    --ink:#e9ede9;
    --ink-soft:#b9c3bd;
    --muted:#84928b;
    --accent:#4fc3d3;
    --accent-ink:#08191c;
    --accent-soft:#173137;
    --good:#57c67c;
    --warn:#d9a441;
    --bad:#e2735c;
    --bad-soft:#3a2420;
    --shadow:0 1px 2px rgba(0,0,0,.35), 0 10px 30px -12px rgba(0,0,0,.55);
  }

  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font:15px/1.5 "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  ::selection{ background:var(--accent); color:var(--accent-ink); }
  button, input, select, textarea{ font:inherit; color:inherit; }
  button{ cursor:pointer; }
  input, select, textarea{
    background:var(--surface); border:1px solid var(--border); color:var(--ink);
    border-radius:6px; padding:6px 8px;
  }
  input:focus-visible, select:focus-visible, textarea:focus-visible, button:focus-visible, [tabindex]:focus-visible{
    outline:2px solid var(--accent); outline-offset:1px;
  }
  .mono{ font-family:"IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace; }
  h1,h2,h3{ text-wrap:balance; margin:0; }
  hr{ border:none; border-top:1px solid var(--border); margin:10px 0; }

  /* ============ App shell ============ */
  #app{
    height:100vh; display:grid;
    grid-template-rows:auto 1fr;
    grid-template-columns:1fr;
  }
  .topbar{
    display:flex; align-items:center; gap:14px;
    padding:10px 16px; background:var(--surface); border-bottom:1px solid var(--border);
    box-shadow:var(--shadow); position:relative; z-index:5;
  }
  .brand{ display:flex; align-items:center; gap:9px; padding-right:8px; border-right:1px solid var(--border);}
  .brand .mark{
    width:26px;height:26px;border-radius:7px;background:var(--accent);color:var(--accent-ink);
    display:flex;align-items:center;justify-content:center;font-size:14px;flex:none;
  }
  .brand .name{ font-weight:600; font-size:14.5px; letter-spacing:.1px; white-space:nowrap;}
  .brand .name small{ display:block; font-weight:400; color:var(--muted); font-size:13px; letter-spacing:.06em; text-transform:uppercase;}
  .model-name{ min-width:160px; max-width:320px; flex:1; font-weight:500; }
  .topbar .spacer{ flex:1; }
  .btnrow{ display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .btn{
    display:inline-flex; align-items:center; gap:6px; border:1px solid var(--border);
    background:var(--surface); padding:7px 11px; border-radius:7px; font-size:13px; font-weight:500;
    color:var(--ink); white-space:nowrap;
  }
  .btn:hover{ background:var(--surface-2); }
  .btn.primary{ background:var(--accent); border-color:var(--accent); color:var(--accent-ink); }
  .btn.primary:hover{ filter:brightness(1.06); }
  .btn.ghost{ background:transparent; border-color:transparent; }
  .btn.ghost:hover{ background:var(--surface-2); }
  .btn.danger{ color:var(--bad); }
  .btn:disabled{ opacity:.45; cursor:not-allowed; }
  .btn svg{ width:14px; height:14px; flex:none; }
  .dl-menu-wrap{ position:relative; }
  .dl-menu{ position:absolute; top:calc(100% + 5px); right:0; background:var(--surface); border:1px solid var(--border); border-radius:8px; box-shadow:var(--shadow); padding:4px; display:flex; flex-direction:column; gap:2px; min-width:110px; z-index:20; }
  .dl-menu button{ text-align:left; padding:7px 10px; border-radius:6px; font-size:12.5px; font-weight:500; color:var(--ink); background:transparent; border:none; }
  .dl-menu button:hover{ background:var(--surface-2); }

  #app{ --w-left:272px; --w-right:328px; }
  .layout{
    display:grid;
    grid-template-columns:var(--w-left) 6px 1fr 6px var(--w-right);
    min-height:0;
  }
  .layout > *{ min-width:0; }
  body{ overflow-x:hidden; }
  .resizer{ flex:none; cursor:col-resize; position:relative; z-index:6; background:transparent; touch-action:none; }
  .resizer::after{ content:''; position:absolute; top:0; bottom:0; left:2px; width:2px; background:var(--border); }
  .resizer:hover::after, .resizer.dragging::after{ background:var(--accent); width:2px; }
  @media (max-width:920px){
    .layout{ grid-template-columns:1fr; grid-template-rows:auto auto 1fr; }
    .resizer{ display:none; }
    .rail-left, .rail-right{ max-height:260px; }
    .topbar{ flex-wrap:wrap; row-gap:8px; }
    .model-name{ min-width:120px; }
    .brand .name small{ display:none; }
  }

  .rail{
    background:var(--surface); min-height:0; display:flex; flex-direction:column;
    overflow:hidden;
  }
  .rail-left{ border-right:1px solid var(--border); }
  .rail-right{ border-left:1px solid var(--border); }
  .rail-section{ padding:12px 14px; border-bottom:1px solid var(--border); }
  .rail-section.grow{ flex:1; overflow-y:auto; min-height:0; }
  .rail-scroll{ flex:1; overflow-y:auto; min-height:0; display:flex; flex-direction:column; }
  .rail-label{
    font-size:13px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; color:var(--muted);
    margin-bottom:9px; display:flex; align-items:center; justify-content:space-between; gap:8px;
  }
  .rail-label .count{
    font-family:"IBM Plex Mono"; font-weight:500; background:var(--surface-2); color:var(--ink-soft);
    border-radius:999px; padding:1px 7px; font-size:12.5px; letter-spacing:0;
  }

  .addgrid{ display:grid; grid-template-columns:1fr 1fr; gap:7px; }
  .addbtn{
    display:flex; flex-direction:column; align-items:flex-start; gap:5px; text-align:left;
    border:1px solid var(--border); background:var(--surface); border-radius:8px; padding:8px 9px;
    font-size:13px; font-weight:500; cursor:grab;
  }
  .addbtn:hover{ background:var(--accent-soft); border-color:var(--accent); }
  .addbtn:active{ cursor:grabbing; }
  .addbtn.drag-source-active{ opacity:.5; }
  .addbtn .ic{ width:17px; height:17px; color:var(--accent); }
  .addbtn.wide{ grid-column:1 / -1; flex-direction:row; align-items:center; }
  .addhint{ font-size:13px; color:var(--muted); margin-top:6px; line-height:1.35; }
  .stage-wrap.drop-active::after{
    content:''; position:absolute; inset:0; pointer-events:none; z-index:5;
    box-shadow:inset 0 0 0 2px var(--accent); background:rgba(12,100,120,.06);
  }

  select.relselect{ width:100%; margin-bottom:7px; }
  .relarm{ width:100%; justify-content:center; }
  .relarm.active{ background:var(--accent); border-color:var(--accent); color:var(--accent-ink); }
  .relhint{ font-size:12.5px; color:var(--muted); margin-top:7px; line-height:1.45; }

  /* cardinality hint — full (properties panel) */
  .card-hint{ margin-top:10px; border:1px solid var(--border); border-radius:9px; background:var(--surface-2); overflow:hidden; }
  .card-hint-diagram{ display:flex; align-items:center; justify-content:center; gap:0; padding:16px 10px 6px; }
  .ch-box{ font-size:13px; font-weight:700; color:var(--ink); background:var(--surface); border:1.3px solid var(--accent); border-radius:6px; padding:5px 9px; white-space:nowrap; max-width:110px; overflow:hidden; text-overflow:ellipsis; }
  .ch-line-wrap{ flex:1; display:flex; flex-direction:column; align-items:center; position:relative; min-width:60px; }
  .ch-line{ width:100%; height:1.6px; background:var(--ink-soft); position:relative; }
  .ch-mult{ font-family:"IBM Plex Mono",monospace; font-size:13px; font-weight:700; color:var(--accent); background:var(--surface-2); padding:0 4px; position:absolute; top:-9px; }
  .ch-mult.left{ left:6px; }
  .ch-mult.right{ right:6px; }
  .card-hint-text{ padding:9px 12px 12px; font-size:13px; line-height:1.5; color:var(--ink-soft); border-top:1px dashed var(--border); }
  .card-hint-text b{ color:var(--ink); font-weight:600; }
  .card-hint-text .ln{ display:flex; gap:6px; margin-top:4px; }
  .card-hint-text .ln:first-child{ margin-top:0; }
  .card-hint-text .dot{ width:5px; height:5px; border-radius:50%; background:var(--accent); flex:0 0 auto; margin-top:6px; }

  /* cardinality hint — compact (left "adicionar relacionamento" panel) */
  .card-hint-mini{ margin-top:8px; border:1px dashed var(--border); border-radius:7px; padding:7px 9px; font-size:13px; line-height:1.45; color:var(--ink-soft); background:var(--surface-2); }
  .card-hint-mini .chm-title{ font-size:12.5px; font-weight:700; text-transform:uppercase; letter-spacing:.03em; color:var(--muted); margin-bottom:3px; }
  .card-hint-mini b{ color:var(--ink); font-weight:600; }

  .listitem{
    display:flex; align-items:center; gap:8px; padding:7px 8px; border-radius:7px; cursor:pointer;
    font-size:12.5px; border:1px solid transparent;
  }
  .listitem:hover{ background:var(--surface-2); }
  .listitem.selected{ background:var(--accent-soft); border-color:var(--accent); }
  .listitem .ic{ width:18px; height:18px; flex:none; color:var(--accent); }
  .listitem .tx{ flex:1; min-width:0; }
  .listitem .tx .t1{ font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .listitem .tx .t2{ color:var(--muted); font-size:13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .listitem .del{ opacity:0; flex:none; }
  .listitem:hover .del{ opacity:1; }
  .del-x{ width:22px; height:22px; display:flex; align-items:center; justify-content:center; border-radius:5px; color:var(--muted); border:1px solid transparent; }
  .del-x:hover{ background:var(--bad-soft); color:var(--bad); }
  .empty-note{ font-size:13px; color:var(--muted); padding:6px 2px; line-height:1.5; }

  .vitem{ display:flex; gap:8px; padding:7px 8px; border-radius:7px; font-size:13px; cursor:pointer; align-items:flex-start;}
  .vitem:hover{ background:var(--surface-2); }
  .vitem .dot{ width:7px;height:7px;border-radius:50%; margin-top:5px; flex:none; }
  .vitem.error .dot{ background:var(--bad); }
  .vitem.warning .dot{ background:var(--warn); }
  .vitem .msg{ line-height:1.4; }
  .vitem .msg b{ font-weight:600; }
  .vgood{ display:flex; align-items:center; gap:7px; font-size:13px; color:var(--good); padding:4px 2px; }

  /* ============ Canvas / stage ============ */
  .stage-wrap{ position:relative; min-width:0; min-height:0; background:var(--canvas-bg); overflow:hidden; user-select:none; -webkit-user-select:none; }
  .stage-wrap svg{ display:block; width:100%; height:100%; touch-action:none; }
  .stage-toolbar{
    position:absolute; right:12px; bottom:12px; display:flex; gap:6px; z-index:4;
  }
  .stage-toolbar button{
    width:30px; height:30px; border-radius:7px; background:var(--canvas-toolbar-bg); backdrop-filter:blur(6px);
    border:1px solid var(--canvas-toolbar-border); color:var(--canvas-ink); display:flex; align-items:center; justify-content:center;
  }
  .stage-toolbar button:hover{ background:var(--canvas-toolbar-hover); }
  .stage-badge{
    position:absolute; left:12px; bottom:12px; z-index:4; color:var(--canvas-ink); font-size:13px;
    font-family:"IBM Plex Mono"; opacity:.55; letter-spacing:.02em;
  }
  .relmode-banner{
    position:absolute; top:12px; left:50%; transform:translateX(-50%); z-index:4;
    background:var(--accent); color:var(--accent-ink); font-size:12.5px; font-weight:500;
    padding:7px 14px; border-radius:999px; box-shadow:var(--shadow); display:none; align-items:center; gap:8px;
  }
  .relmode-banner.show{ display:flex; }
  .relmode-banner button{ background:rgba(0,0,0,.18); border:none; color:inherit; border-radius:999px; width:18px;height:18px; font-size:13px; display:flex; align-items:center; justify-content:center;}

  .node-card{ cursor:grab; filter:drop-shadow(0 1px 2px rgba(20,30,26,.10)) drop-shadow(0 3px 8px rgba(20,30,26,.07)); }
  .node-card.dragging{ cursor:grabbing; }
  .node-card .conn-handle{ opacity:0; fill:var(--canvas-bg); stroke:var(--canvas-line); stroke-width:1.4; cursor:crosshair; transition:opacity .12s,r .1s; }
  .node-card:hover .conn-handle{ opacity:.9; }
  .node-card .conn-handle:hover{ opacity:1; fill:var(--canvas-line); }
  .node-card.conn-target rect.card-bg{ stroke:var(--accent); stroke-width:2.5; }
  .conn-drag-line{ fill:none; stroke:var(--canvas-line); stroke-width:1.6; stroke-dasharray:5,4; pointer-events:none; opacity:.8; }
  .node-card rect.card-bg{ fill:var(--canvas-card); stroke:var(--canvas-card-border); stroke-width:1.25; }
  .node-card.selected rect.card-bg{ stroke:var(--canvas-line); stroke-width:2; }
  .node-card .card-divider{ stroke:var(--canvas-card-border); stroke-width:1; }
  .node-card text{ fill:var(--canvas-card-ink); font-family:"IBM Plex Sans"; }
  .node-card .cname{ font-weight:700; font-size:15px; fill:var(--canvas-card-name); }
  .node-card .geo-chip{ fill:var(--canvas-chip-bg); stroke:var(--canvas-line); stroke-width:1.1; }
  .node-card .chip-glyph{ color:var(--canvas-line); }
  .node-card .cattr{ font-family:"IBM Plex Mono"; font-size:13px; fill:var(--canvas-card-ink); }
  .node-card .cattr .attype{ fill:#7a887f; }
  .node-card .cpk{ font-weight:700; }
  .node-card .attr-key{ color:var(--accent); }
  .node-card .attr-required{ font-family:"IBM Plex Mono"; font-size:12.5px; font-weight:700; fill:var(--canvas-required); }

  .edge-path{ fill:none; stroke-linecap:round; stroke-linejoin:round; }
  .edge-path.association{ stroke:var(--edge-association); stroke-width:1.5; }
  .edge-path.generalization{ stroke:var(--edge-generalization); stroke-width:1.5; }
  .edge-path.aggregation{ stroke:var(--edge-aggregation); stroke-width:1.5; }
  .edge-path.aggregation.spatial-agg{ stroke-dasharray:5,4; }
  .edge-path.network{ stroke:var(--edge-network); stroke-width:1.3; stroke-dasharray:5,3; }
  .edge-path.network-arrow{ stroke:var(--edge-network); stroke-width:1.6; stroke-dasharray:none; }
  .edge-path.spatial{ stroke:var(--edge-spatial); stroke-width:1.5; stroke-dasharray:5,4; }
  .edge-path.selected{ stroke-width:2.75 !important; filter:drop-shadow(0 0 3px rgba(127,208,224,.6)); }
  .edge-label{ font-family:"IBM Plex Mono"; font-size:12.5px; fill:var(--canvas-ink); }
  .edge-label rect{ fill:var(--canvas-bg); }
  .edge-card-label{ fill:var(--canvas-ink); opacity:.85; }

  /* ============ Inspector / right rail ============ */
  .tabs{ display:flex; border-bottom:1px solid var(--border); }
  .tab{ flex:1; padding:10px 6px; text-align:center; font-size:13px; font-weight:600; color:var(--muted); border-bottom:2px solid transparent; }
  .tab.active{ color:var(--accent); border-color:var(--accent); }
  .tab:hover{ background:var(--surface-2); }
  .panel{ display:none; flex:1; min-height:0; flex-direction:column; }
  .panel.active{ display:flex; }

  .field{ margin-bottom:11px; }
  .field label{ display:block; font-size:13px; font-weight:600; color:var(--muted); margin-bottom:4px; text-transform:uppercase; letter-spacing:.04em;}
  .field input, .field select, .field textarea{ width:100%; }
  .field-row{ display:flex; gap:8px; }
  .field-row .field{ flex:1; }
  .chk{ display:flex; align-items:center; gap:7px; font-size:12.5px; margin-bottom:8px; }
  .chk input{ width:auto; }
  .seg{ display:flex; border:1px solid var(--border); border-radius:7px; overflow:hidden; }
  .seg button{ flex:1; padding:7px 4px; font-size:12.5px; background:var(--surface); border:none; border-right:1px solid var(--border); font-weight:500; }
  .seg button:last-child{ border-right:none; }
  .seg button.active{ background:var(--accent); color:var(--accent-ink); }

  .attr-table{ width:100%; border-collapse:collapse; margin-top:4px; }
  .attr-table th{ text-align:left; font-size:12.5px; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; padding:0 4px 4px; font-weight:600;}
  .attr-table td{ padding:3px 3px; vertical-align:middle; }
  .attr-table input[type=text]{ font-size:13px; padding:5px 6px; }
  .attr-table select{ font-size:12.5px; padding:5px 4px; }
  .attr-table input[type=checkbox]{ width:15px; height:15px; }
  .attr-add{ width:100%; margin-top:8px; justify-content:center; }
  .inspector-empty{ padding:30px 18px; text-align:center; color:var(--muted); font-size:12.5px; line-height:1.6; }
  .inspector-empty .ic{ width:30px; height:30px; margin:0 auto 10px; opacity:.5; }
  .inspector-head{ display:flex; align-items:center; gap:8px; margin-bottom:4px; }
  .inspector-head .badge{ font-size:12.5px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; padding:2px 7px; border-radius:999px; background:var(--accent-soft); color:var(--accent); }
  .inspector-scroll{ padding:14px; overflow-y:auto; overflow-x:auto; flex:1; min-height:0; }
  .inspector-actions{ padding:10px 14px; border-top:1px solid var(--border); display:flex; justify-content:flex-end; }

  .exp-tabs{ display:flex; flex-wrap:wrap; gap:6px; padding:10px 12px 0; }
  .exp-tab{ font-size:12.5px; padding:6px 9px; border-radius:6px 6px 0 0; background:var(--surface-2); color:var(--muted); font-weight:600; }
  .exp-tab.active{ background:var(--surface-3); color:var(--ink); }
  .exp-opts{ padding:10px 12px; border-bottom:1px solid var(--border); background:var(--surface-3); display:flex; flex-wrap:wrap; gap:8px 14px; }
  .exp-opts .field{ margin:0; min-width:118px; }
  .exp-opts .field label{ margin-bottom:3px; }
  .exp-opts .chk{ margin:0; align-self:flex-end; padding-bottom:6px; }
  .exp-body{ flex:1; min-height:0; overflow:auto; background:#0c1416; }
  .exp-body pre{ margin:0; padding:14px; font-size:12.5px; line-height:1.6; color:#dce8e4; white-space:pre; }
  .exp-actions{ padding:9px 12px; border-top:1px solid var(--border); display:flex; gap:8px; justify-content:flex-end; }
  .exp-note{ padding:9px 14px; font-size:13px; color:var(--muted); border-top:1px solid var(--border); line-height:1.55; }
  .exp-warn{ flex:0 0 auto; margin:9px 12px 0; padding:7px 10px; border:1px solid var(--warn); border-radius:8px; background:color-mix(in srgb, var(--warn) 14%, var(--surface)); font-size:12.5px; line-height:1.5; color:var(--ink-soft); }
  .exp-warn summary{ cursor:pointer; font-weight:700; color:var(--warn); }
  .exp-warn summary::marker{ color:var(--warn); }
  .exp-warn b{ color:var(--ink); }
  .exp-warn-body{ margin-top:6px; padding-top:6px; border-top:1px dashed var(--border); }
  .exp-warn-body ol{ margin:5px 0 0; padding-left:18px; }
  .exp-warn-body li{ margin-top:3px; }
  .exp-warn-body > div{ margin-top:6px; }

const SVGNS = "http://www.w3.org/2000/svg";
function E(tag, attrs, kids){
  const elx = document.createElement(tag);
  if(attrs) for(const k in attrs){
    if(attrs[k]===null || attrs[k]===undefined) continue;
    if(k==='class') elx.className = attrs[k];
    else if(k==='html') elx.innerHTML = attrs[k];
    else if(k==='style') elx.setAttribute('style', attrs[k]);
    else if(k.indexOf('on')===0 && typeof attrs[k]==='function') elx.addEventListener(k.slice(2), attrs[k]);
    else elx.setAttribute(k, attrs[k]);
  }
  (kids||[]).forEach(k=>{ if(k!==null && k!==undefined) elx.appendChild(typeof k==='string'?document.createTextNode(k):k); });
  return elx;
}
function S(tag, attrs, kids){
  const elx = document.createElementNS(SVGNS, tag);
  if(attrs) for(const k in attrs){
    if(attrs[k]===null || attrs[k]===undefined) continue;
    if(k==='class') elx.setAttribute('class', attrs[k]);

}

/* file names the platform's downloads capability accepts as-is; anything else
   is saved with a .txt suffix appended (still a real, complete file — just
   rename it after saving to get the extension back). */
const DOWNLOAD_ALLOWLIST = new Set(['gif','png','jpg','jpeg','webp','mp4','webm','txt','json','md','docx','pptx','epub','csv','ttf','html','svg','pdf','xml','py','sql']);
function safeDownloadName(base, wantExt){
  return DOWNLOAD_ALLOWLIST.has(wantExt) ? (base+'.'+wantExt) : (base+'.'+wantExt+'.txt');
}
async function saveFile(filename, text){
  let ns = null;
  try{ if(window.claude && window.claude.use) ns = await window.claude.use('downloads'); }catch(e){ ns = null; }
  if(ns){
    try{
      await ns.save({filename, data:text});
      toast('Arquivo salvo: '+filename);
      return;
    }catch(err){
      const code = err && err.code;
      if(code==='declined') return;
      if(code==='rejected_extension' || code==='extension_not_enabled'){
        toast('Este formato não pode ser salvo diretamente aqui — use "Copiar" e cole em um editor de texto.', true);
        return;
      }
      /* otherwise fall through and try the classic path below */
    }
  }
  try{
    const blob = new Blob([text], {type:'text/plain'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 2000);
  }catch(e){
    toast('Não foi possível baixar o arquivo. Use "Copiar" e cole em um editor de texto.', true);
  }
}
function copyText(text, btn){
  const done = ()=>{ if(btn){ const old = btn.textContent; btn.textContent='Copiado!'; setTimeout(()=>{btn.textContent=old;}, 1200); } };
  try{
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(done).catch(()=>fallbackCopy(text, done));
    } else fallbackCopy(text, done);
  }catch(e){ fallbackCopy(text, done); }
}
function fallbackCopy(text, done){
  try{
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.focus(); ta.select();
    document.execCommand('copy'); ta.remove(); done();
  }catch(e){ /* clipboard unavailable in this context */ }
}

function primitiveGlyph(c){

function topoGlyph(rule){

  const mk = (attrs)=>S('circle', Object.assign({r:5, style:'fill:none;stroke:'+c+';stroke-width:1'}, attrs));

function newClassObj(kind, idx){
  const id = uid('c');
  const c = {
    id, name: (kind==='geo' ? 'NovaClasseGeo' : 'NovaClasse') + (idx+1),
    kind,
    geoType: kind==='geo' ? 'object' : null,
    primitive: kind==='geo' ? 'point' : null,
    complexKind: null,
    attributes: [{id:uid('a'), name:'id', type:'integer', pk:true, nullable:false}],
    x: 40 + (idx % 4) * 250,

    w: 208, h: 60
  };

function addClass(kind){
  const c = newClassObj(kind, state.classes.length);
  state.classes.push(c);
  selection = {type:'class', id:c.id};
  touch();
}
function addClassAt(kind, x, y){
  const c = newClassObj(kind, state.classes.length);
  c.x = Math.round(x); c.y = Math.round(y);
  state.classes.push(c);
  selection = {type:'class', id:c.id};
  touch();
}
function deleteClass(id){
  state.classes = state.classes.filter(c=>c.id!==id);
  state.relationships = state.relationships.filter(r=>r.sourceId!==id && r.targetId!==id);
  if(selection.type==='class' && selection.id===id) selection = {type:null,id:null};
  touch();
}
function deleteRel(id){
  state.relationships = state.relationships.filter(r=>r.id!==id);
  if(selection.type==='rel' && selection.id===id) selection = {type:null,id:null};
  touch();
}
function createRelationship(type, sourceId, targetId){
  const base = { id: uid('r'), type, sourceId, targetId, name:'' };
  if(type==='association'){ base.cardSource='1'; base.cardTarget='0..*'; }
  else if(type==='generalization'){ base.total=false; base.disjoint=true; }
  else if(type==='aggregation'){ base.cardSource='1'; base.cardTarget='0..*'; base.spatialControl=false; }
  else if(type==='network'){ base.directed=false; }
  else if(type==='spatial'){ base.topoRule='touches'; }
  state.relationships.push(base);
  selection = {type:'rel', id:base.id};
  return base;
}
function selectClass(id){ selection = {type:'class', id}; switchRightTab('prop'); touch(); }
function selectRel(id){ selection = {type:'rel', id}; switchRightTab('prop'); touch(); }

/* ---------- validation ---------- */
function computeValidation(){
  const issues = [];
  const byId = Object.fromEntries(state.classes.map(c=>[c.id,c]));
  const nameCount = {};
  state.classes.forEach(c=>{ nameCount[c.name]=(nameCount[c.name]||0)+1; });
  state.classes.forEach(c=>{
    if(nameCount[c.name]>1) issues.push({sev:'error', ref:{type:'class',id:c.id}, msg:'Nome de classe duplicado: "'+c.name+'"'});
    if(c.kind==='geo' && !c.primitive) issues.push({sev:'error', ref:{type:'class',id:c.id}, msg:'"'+c.name+'" é geográfica mas não tem primitiva definida'});
    if(!c.attributes.length) issues.push({sev:'warning', ref:{type:'class',id:c.id}, msg:'"'+c.name+'" não possui atributos'});
    if(c.attributes.length && !c.attributes.some(a=>a.pk)) issues.push({sev:'warning', ref:{type:'class',id:c.id}, msg:'"'+c.name+'" não tem chave primária marcada'});
  });
  state.relationships.forEach(r=>{
    const a = byId[r.sourceId], b = byId[r.targetId];
    if(!a || !b) return;
    if(r.type==='generalization'){
      if(a.kind!==b.kind || (a.kind==='geo' && a.geoType!==b.geoType)) issues.push({sev:'warning', ref:{type:'rel',id:r.id}, msg:'Especialização "'+a.name+'" → "'+b.name+'": subclasse e superclasse deveriam ter a mesma natureza de representação'});
    }
    if(r.type==='network'){
      if(a.primitive!=='node') issues.push({sev:'warning', ref:{type:'rel',id:r.id}, msg:'Rede: "'+a.name+'" deveria ter primitiva "Nó"'});
      if(b.primitive!=='arc') issues.push({sev:'warning', ref:{type:'rel',id:r.id}, msg:'Rede: "'+b.name+'" deveria ter primitiva "Arco"'});
    }
    if(r.type==='spatial'){
      if(a.kind!=='geo' || b.kind!=='geo') issues.push({sev:'error', ref:{type:'rel',id:r.id}, msg:'Relação espacial entre "'+a.name+'" e "'+b.name+'" exige que ambas as classes sejam geográficas'});
    }
    if(r.type==='aggregation' && r.spatialControl){
      if(a.kind!=='geo' || b.kind!=='geo') issues.push({sev:'warning', ref:{type:'rel',id:r.id}, msg:'Agregação espacial "'+a.name+'"–"'+b.name+'" com controle topológico deveria envolver classes geográficas'});
    }
  });
  return issues;
}

/* ---------- top-level render orchestration ---------- */
function touch(skipInspector){
  renderClassList();
  renderRelList();
  renderValidation();
  renderCanvas();
  renderExport();
  if(!skipInspector) renderInspector();
  scheduleAutosave();
}

/* ---------- left rail: class/rel lists + validation ---------- */
function renderClassList(){
  const wrap = document.getElementById('classList');
  wrap.innerHTML = '';
  document.getElementById('countClasses').textContent = state.classes.length;
  if(!state.classes.length){
    wrap.appendChild(E('div',{class:'empty-note'},['Nenhuma classe ainda. Use os botões acima para adicionar.']));
    return;
  }
  state.classes.forEach(c=>{
    const sub = c.kind==='geo' ? (c.geoType==='field' ? 'geo-campo · '+ALL_PRIMITIVE_LABEL[c.primitive] : 'geo-objeto · '+ALL_PRIMITIVE_LABEL[c.primitive]) : 'convencional';
    const row = E('div',{class:'listitem'+(selection.type==='class'&&selection.id===c.id?' selected':''), onclick:()=>selectClass(c.id)},[
      E('span',{class:'ic', html:classIcon(c)}),
      E('div',{class:'tx'},[ E('div',{class:'t1'},[c.name]), E('div',{class:'t2'},[sub]) ]),
      E('button',{class:'del-x', title:'Excluir classe', html:ICONS.trash, onclick:(e)=>{ e.stopPropagation(); deleteClass(c.id); }})
    ]);
    wrap.appendChild(row);
  });
}
function renderRelList(){
  const wrap = document.getElementById('relList');
  wrap.innerHTML = '';
  document.getElementById('countRels').textContent = state.relationships.length;
  if(!state.relationships.length){
    wrap.appendChild(E('div',{class:'empty-note'},['Nenhum relacionamento ainda.']));
    return;
  }
  state.relationships.forEach(r=>{
    const a = state.classes.find(x=>x.id===r.sourceId), b = state.classes.find(x=>x.id===r.targetId);
    const row = E('div',{class:'listitem'+(selection.type==='rel'&&selection.id===r.id?' selected':''), onclick:()=>selectRel(r.id)},[
      E('span',{class:'ic', html:ICONS[r.type]||ICONS.association}),
      E('div',{class:'tx'},[ E('div',{class:'t1'},[REL_TYPES[r.type].short]), E('div',{class:'t2'},[(a?a.name:'?')+' — '+(b?b.name:'?')]) ]),
      E('button',{class:'del-x', title:'Excluir relacionamento', html:ICONS.trash, onclick:(e)=>{ e.stopPropagation(); deleteRel(r.id); }})
    ]);
    wrap.appendChild(row);
  });
}
function renderValidation(){
  const wrap = document.getElementById('validationList');
  wrap.innerHTML = '';
  const issues = computeValidation();
  document.getElementById('countIssues').textContent = issues.length;
  if(!issues.length){
    wrap.appendChild(E('div',{class:'vgood'},['✓ Nenhum problema encontrado']));
    return;
  }
  issues.forEach(is=>{
    const row = E('div',{class:'vitem '+is.sev, onclick:()=>{ if(is.ref.type==='class') selectClass(is.ref.id); else selectRel(is.ref.id); }},[
      E('span',{class:'dot'}),
      E('div',{class:'msg'},[is.msg])
    ]);
    wrap.appendChild(row);
  });
}

const CARD_ROW_H = 19;

const CARD_W = 208;

function buildNode(c){
  const isSel = selection.type==='class' && selection.id===c.id;
  const g = S('g', {
    class:'node-card'+(isSel?' selected':''),
    'data-class-id': c.id,
    transform:'translate('+c.x+','+c.y+')',
    onpointerdown:(evt)=>{
      evt.stopPropagation();
      const p = svgPoint(evt);
      drag = {id:c.id, offX:p.x-c.x, offY:p.y-c.y, moved:false};
      try{ evt.currentTarget.setPointerCapture(evt.pointerId); }catch(e){}
    }
  });
  g.appendChild(S('rect',{class:'card-bg', x:0,y:0,width:c.w,height:c.h, rx:9}));
  g.appendChild(S('text',{class:'cname', x:12, y:22},[c.name]));
  // geometry chip (top-right) — presence/absence + icon replaces the old text stereotype
  if(c.kind==='geo' && c.primitive){
    const chipSize = 20, chx = c.w-11-chipSize, chy = 8;
    g.appendChild(S('rect',{class:'geo-chip', x:chx, y:chy, width:chipSize, height:chipSize, rx:5}));
    const glyph = primitiveGlyph(c);
    glyph.setAttribute('transform','translate('+(chx+chipSize/2)+','+(chy+chipSize/2)+')');
    glyph.setAttribute('class','pglyph chip-glyph');
    g.appendChild(glyph);
  }
  g.appendChild(S('line',{class:'card-divider', x1:0,y1:CARD_HEAD_H,x2:c.w,y2:CARD_HEAD_H}));
  const nameX = 12 + 15; // fixed prefix slot so attribute names line up regardless of key/required marker
  if(!c.attributes.length){
    g.appendChild(S('text',{class:'cattr', x:nameX, y:CARD_HEAD_H+CARD_ROW_H-6, style:'fill:var(--muted);font-style:italic;'},['(sem atributos)']));
  } else {
    c.attributes.forEach((a,i)=>{
      const y = CARD_HEAD_H + CARD_ROW_H*(i+1) - 6;
      if(a.pk){
        const k = keyGlyph();
        k.setAttribute('transform','translate('+15+','+(y-3.6)+')');
        g.appendChild(k);
      } else if(!a.nullable){
        g.appendChild(S('text',{class:'attr-required', x:13, y:y},['*']));
      }
      const t = S('text',{class:'cattr', x:nameX, y:y});
      const nameSpan = S('tspan',{class: a.pk ? 'cpk' : ''},[a.name]);
      const typeSpan = S('tspan',{class:'attype'},[' : '+ATTR_TYPE_LABEL[a.type]]);
      t.appendChild(nameSpan); t.appendChild(typeSpan);
      g.appendChild(t);
    });
  }
  // connection handles — one on each side, hidden until hover; drag from one
  // to another class to create a relationship (of the type currently picked
  // in the "Adicionar relacionamento" panel) without any separate mode.
  const handleDefs = [
    {side:'top', x:c.w/2, y:0}, {side:'bottom', x:c.w/2, y:c.h},
    {side:'left', x:0, y:c.h/2}, {side:'right', x:c.w, y:c.h/2}
  ];
  handleDefs.forEach(hd=>{
    g.appendChild(S('circle',{class:'conn-handle', 'data-side':hd.side, cx:hd.x, cy:hd.y, r:5,
      onpointerdown:(evt)=>{
        evt.stopPropagation();
        const p = svgPoint(evt);
        connDrag = {sourceId:c.id, sourceSide:hd.side, x:p.x, y:p.y};
        try{ evt.currentTarget.setPointerCapture(evt.pointerId); }catch(e){}
        renderConnDragOverlay();
      }
    }));
  });
  return g;
}
/* Live preview line + drop-target highlight while dragging a relationship
   out of a class's connection handle (see buildNode / connDrag). */
function renderConnDragOverlay(){
  const layer = document.getElementById('connDragLayer');
  if(!layer) return;
  layer.innerHTML = '';
  document.querySelectorAll('.node-card.conn-target').forEach(el=>el.classList.remove('conn-target'));
  if(!connDrag) return;
  const src = state.classes.find(c=>c.id===connDrag.sourceId);
  if(!src) return;
  const srcRect = {x:src.x, y:src.y, w:src.w||CARD_W, h:src.h||classHeight(src)};
  const startPt = pointOnSide(srcRect, connDrag.sourceSide, 0);
  layer.appendChild(S('path',{class:'conn-drag-line', d:'M'+startPt.x+','+startPt.y+' L'+connDrag.x+','+connDrag.y}));
  const target = state.classes.find(cl=> cl.id!==connDrag.sourceId
    && connDrag.x>=cl.x && connDrag.x<=cl.x+(cl.w||CARD_W) && connDrag.y>=cl.y && connDrag.y<=cl.y+(cl.h||classHeight(cl)));
  if(target){
    const el = document.querySelector('.node-card[data-class-id="'+target.id+'"]');
    if(el) el.classList.add('conn-target');
  }
}
function rectBorderPoint(rect, toward){
  const cx=rect.x+rect.w/2, cy=rect.y+rect.h/2;
  const dx=toward.x-cx, dy=toward.y-cy;
  if(dx===0 && dy===0) return {x:cx,y:cy};
  const hw=rect.w/2, hh=rect.h/2;
  const scale = 1/Math.max(Math.abs(dx)/hw, Math.abs(dy)/hh);
  return {x:cx+dx*scale, y:cy+dy*scale};
}
function edgeText(x,y,text,extraClass,onclick){
  return S('text',{class:'edge-card-label'+(extraClass?' '+extraClass:''), x:x, y:y, 'text-anchor':'middle',
    style: onclick ? 'cursor:pointer;' : undefined, onclick}, [text]);
}

/* ---------- orthogonal (UML-style) edge routing ---------- */
const HOP_R = 9;
/* Which border ("left"/"right"/"top"/"bottom") each end of a relationship
   exits from — driven by the same gap comparison the old single-route
   builder used, just exposed as named sides so ports can be assigned. */
function decideSides(aRect, bRect){
  const acx=aRect.x+aRect.w/2, acy=aRect.y+aRect.h/2;
  const bcx=bRect.x+bRect.w/2, bcy=bRect.y+bRect.h/2;
  const dx = bcx-acx, dy = bcy-acy;
  const hGap = Math.max(aRect.x-(bRect.x+bRect.w), bRect.x-(aRect.x+aRect.w));
  const vGap = Math.max(aRect.y-(bRect.y+bRect.h), bRect.y-(aRect.y+aRect.h));
  if(hGap >= vGap){
    return { aSide: dx>=0 ? 'right':'left', bSide: dx>=0 ? 'left':'right' };
  }
  return { aSide: dy>=0 ? 'bottom':'top', bSide: dy>=0 ? 'top':'bottom' };
}
/* Exact point on a rect's border for a given side, offset along that side
   from its center (used to spread multiple edges out along one border
   instead of all of them meeting at the dead-center point). */
function pointOnSide(rect, side, offset){
  const cx=rect.x+rect.w/2, cy=rect.y+rect.h/2;
  if(side==='left') return {x:rect.x, y:cy+offset};
  if(side==='right') return {x:rect.x+rect.w, y:cy+offset};
  if(side==='top') return {x:cx+offset, y:rect.y};
  return {x:cx+offset, y:rect.y+rect.h}; // bottom
}
/* Build the orthogonal point list between two already-placed port points,
   given the side each was placed on (both sides always share the same
   orientation, since decideSides picks one axis for both ends). */
function buildElbowPoints(a, aSide, b, bSide){
  const horiz = (aSide==='left' || aSide==='right');
  let pts;
  if(horiz){
    if(Math.abs(a.y-b.y)<0.5){ pts = [a, b]; }
    else { const midX = (a.x+b.x)/2; pts = [a, {x:midX,y:a.y}, {x:midX,y:b.y}, b]; }
  } else {
    if(Math.abs(a.x-b.x)<0.5){ pts = [a, b]; }
    else { const midY = (a.y+b.y)/2; pts = [a, {x:a.x,y:midY}, {x:b.x,y:midY}, b]; }
  }
  const out = [pts[0]];
  for(let i=1;i<pts.length;i++){
    const p=pts[i], q=out[out.length-1];
    if(Math.abs(p.x-q.x)>0.01 || Math.abs(p.y-q.y)>0.01) out.push(p);
  }
  return out;
}
const OBSTACLE_MARGIN = 12;
function rectHitsObstacles(x1,y1,x2,y2, obstacles){
  const lox=Math.min(x1,x2), hix=Math.max(x1,x2), loy=Math.min(y1,y2), hiy=Math.max(y1,y2);
  return obstacles.some(o=> lox < o.x2 && hix > o.x1 && loy < o.y2 && hiy > o.y1);
}
/* Grid/BFS orthogonal router: a plain midpoint elbow can cut straight through
   an unrelated class card when the two endpoints sit on a diagonal (e.g. one
   node directly above another that itself sits between source and target).
   This routes around every OTHER class's card instead, using the standard
   technique of only needing grid lines through obstacle corners (+ the two
   port points) to find an optimal Manhattan path, with a 0-1 BFS that
   prefers straight runs over extra turns. Returns null (caller falls back
   to the simple elbow) if no route is found or the model is too large to
   route this way cheaply. */
function routeOrthogonal(a, aSide, b, bSide, obstacles){
  const xsSet = new Set([a.x, b.x]), ysSet = new Set([a.y, b.y]);
  obstacles.forEach(o=>{ xsSet.add(o.x1); xsSet.add(o.x2); ysSet.add(o.y1); ysSet.add(o.y2); });
  const xs = [...xsSet].sort((p,q)=>p-q);
  const ys = [...ysSet].sort((p,q)=>p-q);
  if(xs.length>44 || ys.length>44) return null; // keep this cheap; caller falls back
  const xi = xs.reduce((m,v,i)=>(m[v]=i,m),{}), yi = ys.reduce((m,v,i)=>(m[v]=i,m),{});
  const W = xs.length, H = ys.length;
  const blockedH = {}, blockedV = {}; // blockedH[ix+','+iy] = segment (ix,iy)-(ix+1,iy) blocked
  for(let iy=0; iy<H; iy++) for(let ix=0; ix<W-1; ix++) blockedH[ix+','+iy] = rectHitsObstacles(xs[ix],ys[iy],xs[ix+1],ys[iy], obstacles);
  for(let ix=0; ix<W; ix++) for(let iy=0; iy<H-1; iy++) blockedV[ix+','+iy] = rectHitsObstacles(xs[ix],ys[iy],xs[ix],ys[iy+1], obstacles);
  const startIx = xi[a.x], startIy = yi[a.y], endIx = xi[b.x], endIy = yi[b.y];
  if(startIx===undefined||startIy===undefined||endIx===undefined||endIy===undefined) return null;
  const DIRV = [[0,-1],[0,1],[-1,0],[1,0]]; // 0 up, 1 down, 2 left, 3 right
  const sideDir = side=> side==='top'?0 : side==='bottom'?1 : side==='left'?2 : 3;
  const aRequiredDir = sideDir(aSide);
  // last move must travel toward bSide's outward normal to land on that port
  const bRequiredDir = bSide==='top'?1 : bSide==='bottom'?0 : bSide==='left'?3 : 2;
  const startKey = startIx+','+startIy+',-1';
  const dist = new Map([[startKey,0]]);
  const prev = new Map();
  const visited = new Set();
  const dq = [startKey];
  while(dq.length){
    const cur = dq.shift();
    if(visited.has(cur)) continue;
    visited.add(cur);
    const [cixS,ciyS,cdirS] = cur.split(',');
    const ix=+cixS, iy=+ciyS, cdir=+cdirS;
    const d0 = dist.get(cur);
    for(let dIdx=0; dIdx<4; dIdx++){
      if(cdir===-1 && dIdx!==aRequiredDir) continue;
      const [ddx,ddy] = DIRV[dIdx];
      const nix=ix+ddx, niy=iy+ddy;
      if(nix<0||nix>=W||niy<0||niy>=H) continue;
      const blocked = ddx!==0 ? blockedH[Math.min(ix,nix)+','+iy] : blockedV[ix+','+Math.min(iy,niy)];
      if(blocked) continue;
      const atTarget = (nix===endIx && niy===endIy);
      if(atTarget && dIdx!==bRequiredDir) continue;
      const turnCost = (cdir===-1 || cdir===dIdx) ? 0 : 1;
      const nd = d0 + turnCost;
      const nkey = nix+','+niy+','+dIdx;
      if(!dist.has(nkey) || dist.get(nkey) > nd){
        dist.set(nkey, nd);
        prev.set(nkey, cur);
        if(turnCost===0) dq.unshift(nkey); else dq.push(nkey);
      }
    }
  }
  const finalKey = endIx+','+endIy+','+bRequiredDir;
  if(!dist.has(finalKey)) return null;
  const path = [];
  let cur = finalKey;
  while(cur !== startKey){
    const [cixS,ciyS] = cur.split(',');
    path.push({x:xs[+cixS], y:ys[+ciyS]});

  } else if(r.type==='network'){
    lbl(mid.x, mid.y, 'rede'+(r.directed?' →':''), normMid);
  } else if(r.type==='spatial'){
    // OMT-G: dashed line + the predicate's name as a «stereotype» on the line.
    lbl(mid.x, mid.y, '«'+(TOPO_RULE_SHORT[r.topoRule]||r.topoRule)+'»', normMid);
  }
  // generalization has no floating label anymore — the triangle itself
  // (fill + apex dot) encodes total/partial and disjoint/overlapping.
  return g;
}
function renderCanvas(){
  const nodeLayer = document.getElementById('nodeLayer');
  const edgeLayer = document.getElementById('edgeLayer');
  const labelLayer = document.getElementById('labelLayer');
  nodeLayer.innerHTML = ''; edgeLayer.innerHTML = ''; if(labelLayer) labelLayer.innerHTML = '';
  const rects = {};
  state.classes.forEach(c=>{ c.w = CARD_W; c.h = classHeight(c); rects[c.id] = {x:c.x,y:c.y,w:c.w,h:c.h}; });

  // Phase 1: assign a border port to every relationship end (spreading
  // multiple edges off the same node+side apart) and route each edge
  // orthogonally between its two ports.
  const allPoints = assignPorts(state.relationships, rects);
  const routes = state.relationships.map((r,idx)=>{
    const points = allPoints[idx];
    if(!points) return null;
    return { r, points };
  });

  separateOverlappingMiddleSegments(routes);

  // finalize segments/hop buckets from the (possibly lane-separated) points
  routes.forEach(route=>{
    if(!route) return;
    route.segs = segmentsOf(route.points);
    route.hops = route.segs.map(()=>[]);
  });

  // Phase 2: detect crossings — a horizontal segment "hops" over any vertical
  // segment of another edge that crosses it in its interior (UML jump-over).
  const EPS = HOP_R + 3;
  for(let i=0;i<routes.length;i++){
    const ri = routes[i];
    if(!ri) continue;
    for(let j=0;j<routes.length;j++){
      if(i===j) continue;
      const rj = routes[j];
      if(!rj) continue;
      ri.segs.forEach((segH, hi)=>{
        if(!segH.horiz) return;
        const hy = segH.y1, hx1 = Math.min(segH.x1,segH.x2), hx2 = Math.max(segH.x1,segH.x2);
        rj.segs.forEach(segV=>{
          if(segV.horiz) return;
          const vx = segV.x1, vy1 = Math.min(segV.y1,segV.y2), vy2 = Math.max(segV.y1,segV.y2);
          if(vx>hx1+EPS && vx<hx2-EPS && hy>vy1+EPS && hy<vy2-EPS){
            ri.hops[hi].push(vx);
          }
        });
      });
    }
  }

  // Phase 3: build DOM
  const labelMetas = [];
  routes.forEach(route=>{ if(route) edgeLayer.appendChild(buildEdgeDom(route, labelLayer, labelMetas, rects)); });
  resolveLabelOverlaps(labelMetas);
  state.classes.forEach(c=> nodeLayer.appendChild(buildNode(c)) );
}

/* ---------- defs: markers + grid pattern ---------- */
function initDefs(){
  const defs = document.getElementById('svgDefs');
  // Generalization markers: OMT-G encodes disjoint/overlapping via hollow/filled
  // triangle, and total/partial via a dot at the triangle apex (absent = partial).
  // refX sits exactly at the triangle apex (the touching point) so the marker
  // fully covers the line end — no gap where the raw stroke would poke through.
  function genMarker(id, filled, dot){
    const kids = [S('path',{d:'M1,1 L12,6 L1,11 Z', style:'fill:'+(filled?'var(--edge-generalization)':'var(--canvas-bg)')+';stroke:var(--edge-generalization);stroke-width:1.3;stroke-linejoin:round'})];
    if(dot) kids.push(S('circle',{cx:9.3,cy:6,r:1.25, style:'fill:var(--edge-generalization)'}));
    return S('marker',{id:id, viewBox:'0 0 13 12', refX:12, refY:6, markerWidth:13, markerHeight:12, orient:'auto'}, kids);
  }
  defs.appendChild(genMarker('marker-gen-pd', false, false)); // parcial, disjunta
  defs.appendChild(genMarker('marker-gen-td', false, true));  // total, disjunta
  defs.appendChild(genMarker('marker-gen-po', true,  false)); // parcial, sobreposta
  defs.appendChild(genMarker('marker-gen-to', true,  true));  // total, sobreposta
  defs.appendChild(S('marker',{id:'marker-diamond', viewBox:'0 0 14 10', refX:1, refY:5, markerWidth:13, markerHeight:9, orient:'auto'},[
    S('path',{d:'M1,5 L7,1 L13,5 L7,9 Z', style:'fill:var(--canvas-bg);stroke:var(--edge-aggregation);stroke-width:1.3;stroke-linejoin:round'})
  ]));
  defs.appendChild(S('marker',{id:'marker-arrow', viewBox:'0 0 10 10', refX:9, refY:5, markerWidth:8, markerHeight:8, orient:'auto'},[
    S('path',{d:'M1,1 L9,5 L1,9', style:'fill:none;stroke:var(--edge-network);stroke-width:1.6;stroke-linejoin:round;stroke-linecap:round'})
  ]));
  const minor = S('pattern',{id:'gridMinor', width:24, height:24, patternUnits:'userSpaceOnUse'},[
    S('path',{d:'M0,24 L0,0 L24,0', style:'fill:none;stroke:var(--canvas-grid);stroke-width:1'})
  ]);
  const major = S('pattern',{id:'gridMajor', width:120, height:120, patternUnits:'userSpaceOnUse'},[
    S('path',{d:'M0,120 L0,0 L120,0', style:'fill:none;stroke:var(--canvas-grid-major);stroke-width:1'})
  ]);
  defs.appendChild(minor); defs.appendChild(major);
  const gridLayer = document.getElementById('gridLayer');
  gridLayer.appendChild(S('rect',{x:-8000,y:-8000,width:16000,height:16000, fill:'url(#gridMinor)'}));
  gridLayer.appendChild(S('rect',{x:-8000,y:-8000,width:16000,height:16000, fill:'url(#gridMajor)'}));
}

/* ---------- pan / zoom / drag ---------- */
function applyViewBox(){
  const svg = document.getElementById('canvasSvg');
  svg.setAttribute('viewBox', view.x+' '+view.y+' '+view.w+' '+view.h);
  document.getElementById('stageBadge').textContent = Math.round((1200/view.w)*100)+'%';
}
/* The SVG keeps its default preserveAspectRatio ("xMidYMid meet"), so when
   the viewBox's aspect ratio doesn't exactly match the element's rendered
   box (a resize before the next fitView, or any rounding in between) the
   browser letterboxes it — equal scale on both axes, centered, with blank
   margins on whichever axis has room to spare. Any screen<->canvas mapping
   has to invert that same transform, not just divide width/height
   independently, or clicks/drags drift off their target on that axis. */
function svgTransform(){
  const svg = document.getElementById('canvasSvg');
  const rect = svg.getBoundingClientRect();
  const scale = Math.min(rect.width/view.w, rect.height/view.h) || 1;
  const offX = (rect.width - view.w*scale)/2, offY = (rect.height - view.h*scale)/2;
  return {rect, scale, offX, offY};
}
function svgPoint(evt){
  const {rect, scale, offX, offY} = svgTransform();
  return { x: view.x + (evt.clientX-rect.left-offX)/scale, y: view.y + (evt.clientY-rect.top-offY)/scale };
}
function fitView(){
  if(!state.classes.length){ view = {x:-40,y:-40,w:1200,h:800}; applyViewBox(); return; }
  let minX=Infinity,minY=Infinity,maxX=-Infinity,maxY=-Infinity;
  state.classes.forEach(c=>{
    minX=Math.min(minX,c.x); minY=Math.min(minY,c.y);
    maxX=Math.max(maxX,c.x+(c.w||CARD_W)); maxY=Math.max(maxY,c.y+(c.h||60));
  });
  const pad=60;
  const w = Math.max(400,(maxX-minX)+pad*2), h = Math.max(300,(maxY-minY)+pad*2);
  const cx = (minX+maxX)/2, cy=(minY+maxY)/2;
  const ar = document.getElementById('stageWrap').clientWidth / Math.max(1,document.getElementById('stageWrap').clientHeight);
  let vw = w, vh = w/ar;
  if(vh < h){ vh = h; vw = h*ar; }
  view = {x: cx-vw/2, y: cy-vh/2, w: vw, h: vh};
  applyViewBox();
}
function initStageEvents(){
  const stage = document.getElementById('stageWrap');
  const svg = document.getElementById('canvasSvg');
  svg.addEventListener('pointerdown', (evt)=>{
    panning = {x:evt.clientX, y:evt.clientY, vx:view.x, vy:view.y, moved:false};
    try{ svg.setPointerCapture(evt.pointerId); }catch(e){}
  });
  document.addEventListener('pointermove', (evt)=>{
    if(drag){
      const p = svgPoint(evt);
      const nx = p.x - drag.offX, ny = p.y - drag.offY;
      const c = state.classes.find(x=>x.id===drag.id);
      if(!c) return;
      if(Math.abs(nx-c.x)>1 || Math.abs(ny-c.y)>1) drag.moved = true;
      c.x = nx; c.y = ny;
      renderCanvas();
    } else if(panning){
      const {scale} = svgTransform();
      const dx = (evt.clientX-panning.x), dy=(evt.clientY-panning.y);
      if(Math.abs(dx)>3 || Math.abs(dy)>3) panning.moved = true;
      view.x = panning.vx - dx/scale;
      view.y = panning.vy - dy/scale;
      applyViewBox();
    } else if(connDrag){
      const p = svgPoint(evt);
      connDrag.x = p.x; connDrag.y = p.y;
      renderConnDragOverlay();
    }
  });
  document.addEventListener('pointerup', (evt)=>{
    if(drag){
      const wasDrag = drag.moved, id = drag.id;
      drag = null;
      if(!wasDrag) handleNodeClick(id); else { renderCanvas(); scheduleAutosave(); }
    }
    if(panning){
      if(!panning.moved){ selection = {type:null,id:null}; renderInspector(); renderCanvas(); renderClassList(); renderRelList(); }
      panning = null;
    }
    if(connDrag){
      const p = svgPoint(evt);
      const sourceId = connDrag.sourceId;
      const target = state.classes.find(cl=> cl.id!==sourceId
        && p.x>=cl.x && p.x<=cl.x+(cl.w||CARD_W) && p.y>=cl.y && p.y<=cl.y+(cl.h||classHeight(cl)));
      connDrag = null;
      if(target){ createRelationship(relMode.type, sourceId, target.id); touch(); }
      renderConnDragOverlay();
    }
  });
  stage.addEventListener('wheel', (evt)=>{
    evt.preventDefault();
    const p = svgPoint(evt);
    const factor = evt.deltaY>0 ? 1.09 : 1/1.09;
    const newW = clamp(view.w*factor, 260, 5000);
    const newH = newW*(view.h/view.w);
    view.x = p.x - (p.x-view.x)*(newW/view.w);
    view.y = p.y - (p.y-view.y)*(newH/view.h);
    view.w = newW; view.h = newH;
    applyViewBox();
  }, {passive:false});
  document.getElementById('zoomIn').addEventListener('click', ()=>zoomBy(1/1.25));
  document.getElementById('zoomOut').addEventListener('click', ()=>zoomBy(1.25));
  document.getElementById('zoomReset').addEventListener('click', fitView);

  // drag-and-drop: drop a class kind from the left palette onto the canvas
  stage.addEventListener('dragover', (evt)=>{
    if(!evt.dataTransfer || !Array.from(evt.dataTransfer.types||[]).includes('application/x-omtg-kind')) return;
    evt.preventDefault();
    evt.dataTransfer.dropEffect = 'copy';
    stage.classList.add('drop-active');
  });
  stage.addEventListener('dragleave', (evt)=>{
    if(evt.target===stage) stage.classList.remove('drop-active');
  });
  stage.addEventListener('drop', (evt)=>{
    stage.classList.remove('drop-active');
    if(!evt.dataTransfer) return;
    const kind = evt.dataTransfer.getData('application/x-omtg-kind');
    if(kind!=='conventional' && kind!=='geo') return;
    evt.preventDefault();
    const p = svgPoint(evt);
    addClassAt(kind, p.x - CARD_W/2, p.y - 22);
  });
  document.addEventListener('keydown', (evt)=>{
    if(evt.key==='Escape'){
      if(connDrag){ connDrag=null; renderConnDragOverlay(); }
    }
    if((evt.key==='Delete'||evt.key==='Backspace') && selection.type && document.activeElement.tagName!=='INPUT' && document.activeElement.tagName!=='TEXTAREA' && document.activeElement.tagName!=='SELECT'){
      if(selection.type==='class') deleteClass(selection.id);
      else if(selection.type==='rel') deleteRel(selection.id);
    }
  });
}
function zoomBy(factor){
  const cx = view.x+view.w/2, cy = view.y+view.h/2;
  const newW = clamp(view.w*factor, 260, 5000);
  const newH = newW*(view.h/view.w);
  view = {x:cx-newW/2, y:cy-newH/2, w:newW, h:newH};
  applyViewBox();
}

/* [instruction, [sourceEndLabel, targetEndLabel]] per relationship type — the

/* ---------- cardinality hint (visual explainer for relationship multiplicities) ---------- */

  switch(v){
    case '1': return 'exatamente 1';
    case '0..1': return '0 ou 1';

    case '1..*': return '1..* (um ou vários)';
    default: return v;
  }
}
